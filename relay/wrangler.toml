# The relay two snyvis meet through. One Worker, two Durable Object classes:
# a Room for the minute of pairing and a Mailbox per address. It holds
# ciphertext and public keys and nothing it could read; see README.md and
# docs/PEER.md for what it sees and for how long.
name = "snyvi-relay"
main = "src/index.ts"
compatibility_date = "2026-06-01"

# relay.snyvi.com is the name the daemon has as a constant; workers.dev stays
# on so a build can be tried before the zone answers.
workers_dev = true
routes = [{ pattern = "relay.snyvi.com", custom_domain = true }]

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "MAILBOX"
class_name = "Mailbox"

# 1.25.0: a Line per friendship, and the one Meter that estimates the day.
[[durable_objects.bindings]]
name = "LINE"
class_name = "Line"

[[durable_objects.bindings]]
name = "METER"
class_name = "Meter"

# SQLite-backed: the free plan's kind, and the one with a SQL API, which is
# where an 8 MB frame goes in 1 MB rows.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Mailbox"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Line", "Meter"]

# Nothing beyond Cloudflare's own request counts. No Workers Logs, no traces:
# a line per request would be a list of who talks to whom.
[observability]
enabled = false

# The limits, counted per Cloudflare location, in windows of 60 s. Keyed by
# who is asking (src/index.ts says by what); an IP only where nothing else
# is, because many people can share one. An honest daemon makes a few calls
# a minute; a pairing is 4 to 8.

[[ratelimits]]
name = "LIMIT_FLOOD"   # by IP, everything: a backstop
namespace_id = "1101"
simple = { limit = 600, period = 60 }

[[ratelimits]]
name = "LIMIT_FIRST"   # by IP: a mailbox's first sign-in, a room's first message
namespace_id = "1102"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "LIMIT_ROOM"    # by room id
namespace_id = "1103"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "LIMIT_INBOX"   # by address, signed
namespace_id = "1104"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "LIMIT_SEND"    # by sender, signed
namespace_id = "1105"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "LIMIT_SEND_BIG"
namespace_id = "1106"
simple = { limit = 8, period = 60 }

[[ratelimits]]
name = "LIMIT_UNSIGNED"   # by IP: 1.18.0 daemons, until REQUIRE_SIGNED
namespace_id = "1107"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "LIMIT_UNSIGNED_BIG"
namespace_id = "1108"
simple = { limit = 8, period = 60 }

# `npm test` runs `wrangler dev --env test`: the same Worker, with the IP
# limits out of the way (every test comes from 127.0.0.1) and RELAY_TEST,
# which turns on the two /_test routes the tests look inside a mailbox
# with. The room's limit keeps its real number: each test has its own room,
# and one test spends a room's 30. Never deployed.
[env.test]
vars = { RELAY_TEST = "1" }

[[env.test.durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[env.test.durable_objects.bindings]]
name = "MAILBOX"
class_name = "Mailbox"

[[env.test.durable_objects.bindings]]
name = "LINE"
class_name = "Line"

[[env.test.durable_objects.bindings]]
name = "METER"
class_name = "Meter"

[[env.test.ratelimits]]
name = "LIMIT_FLOOD"
namespace_id = "2101"
simple = { limit = 100000, period = 60 }

[[env.test.ratelimits]]
name = "LIMIT_FIRST"
namespace_id = "2102"
simple = { limit = 100000, period = 60 }

[[env.test.ratelimits]]
name = "LIMIT_ROOM"
namespace_id = "2103"
simple = { limit = 30, period = 60 }

[[env.test.ratelimits]]
name = "LIMIT_INBOX"
namespace_id = "2104"
simple = { limit = 100000, period = 60 }

[[env.test.ratelimits]]
name = "LIMIT_SEND"
namespace_id = "2105"
simple = { limit = 100000, period = 60 }

[[env.test.ratelimits]]
name = "LIMIT_SEND_BIG"
namespace_id = "2106"
simple = { limit = 100000, period = 60 }

[[env.test.ratelimits]]
name = "LIMIT_UNSIGNED"
namespace_id = "2107"
simple = { limit = 100000, period = 60 }

[[env.test.ratelimits]]
name = "LIMIT_UNSIGNED_BIG"
namespace_id = "2108"
simple = { limit = 100000, period = 60 }
