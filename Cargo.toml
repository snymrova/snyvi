[package]
name = "snyvi"
version = "0.7.0"
edition = "2021"
description = "A fast, beautiful viewer for the documents your agents produce"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-std", "io-util", "sync", "time", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
comrak = { version = "0.39", default-features = false }
syntect = { version = "5", default-features = false, features = ["default-onig", "dump-create"] }
ammonia = "4"
rusqlite = { version = "0.37", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
blake3 = "1"
dirs = "6"
getrandom = "0.3"
time = { version = "0.3", features = ["formatting", "macros", "local-offset"] }
anyhow = "1"
mime_guess = "2"
html-escape = "0.2"
similar = "2"
ignore = "0.4"
mimalloc = { version = "0.1", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# Two executables. `snyvi` is everything -- daemon, CLI, MCP server, hook -- and
# never links a browser engine, so it stays static and depends on nothing.
# `snyvi-app` is the native window and nothing else; `snyvi app` finds it and
# hands it a URL. Built separately: the static target cannot link WebKitGTK.
[[bin]]
name = "snyvi"
path = "src/main.rs"

[[bin]]
name = "snyvi-app"
path = "src/bin/app.rs"
required-features = ["desktop"]

[features]
default = []
# Builds the `snyvi-app` window executable. Nothing in `snyvi` is conditional on it.
desktop = [
  "dep:tauri",
  "dep:tauri-build",
  "dep:tauri-plugin-window-state",
  "dep:tauri-plugin-single-instance",
]

[dependencies.tauri]
version = "2"
optional = true
default-features = false
# tray-icon for the tray; image-png to decode the mark that the tray and the
# window are handed, which is compiled into the binary rather than looked up
# on disk so a tarball install has no second file to lose.
features = ["wry", "tray-icon", "image-png"]

[dependencies.tauri-plugin-window-state]
version = "2"
optional = true

[dependencies.tauri-plugin-single-instance]
version = "2"
optional = true

[build-dependencies]
tauri-build = { version = "2", optional = true }

# Only when building on Windows, and only to stamp the icon onto snyvi.exe.
# Cargo matches a build-dependency's target section against the host, so a
# Linux build -- which is every release build of the static binary -- never
# resolves this at all.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
