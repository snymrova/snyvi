[package]
name = "snyvi"
version = "1.29.0"
edition = "2021"
description = "A fast, beautiful viewer for the documents your agents produce"
license = "MIT"
repository = "https://github.com/snymrova/snyvi"
homepage = "https://mrova.rocks/snyvi"
readme = "README.md"
keywords = ["mcp", "markdown", "viewer", "agent", "documents"]
categories = ["command-line-utilities", "text-processing", "development-tools"]

# What a build needs and nothing else. The film is 70 MB of frames and
# narration, the README's pictures another 10, and a crate is capped at 10:
# `cargo package` came to 18.2 MB before this list and 4.6 MB after it. What
# stays is what `cargo install snyvi` compiles -- `ui/` and `syntaxes/` are
# embedded by `include_bytes!`, `icons/` is the Windows resource and the
# tray, `desktop-dist/` is the window's frontend -- plus the prose, which is
# small and is half of what the crate is for.
exclude = [
    "/film",
    "/docs/media",
    "/bench",
    "/.github",
    "/relay",
]

# The oldest snyvi-app this daemon is happy with. The release job copies it
# into latest.json as `app_min`, and a daemon updating itself relaunches the
# window only when the manifest's app_min is above the window it has; most
# releases never touch the window, and the reader should not see it flash for
# them. Bump it by hand, to the version being released, whenever the window's
# own code changes: src/desktop.rs, src/bin/app.rs, tauri.conf.json, the frame.
[package.metadata.snyvi]
app_min = "1.21.0"

[dependencies]
axum = { version = "0.8", features = ["json", "ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-std", "io-util", "sync", "time", "signal", "process"] }
tokio-stream = { version = "0.1", features = ["sync"] }
comrak = { version = "0.39", default-features = false }
syntect = { version = "5", default-features = false, features = ["default-onig", "dump-create"] }
ammonia = "4"
rusqlite = { version = "0.37", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ureq = { version = "3", features = ["json"] }
# The link to the relay (`server::peer_link`): one WebSocket per daemon, so a
# friend's document arrives the moment it lands and the mailbox sleeps in
# between. tungstenite is in the tree already through axum's `ws`; the TLS
# half shares rustls and webpki-roots with ureq, so the link itself adds
# little (tokio-rustls, 8 KB). What the feature costs -- 0.7 MB, mostly the
# cryptography below -- is measured in src/bench.rs (`BINARY_MB`).
# futures-util is only for `StreamExt`/`SinkExt` on that socket, and axum
# carries it already.
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
blake3 = "1"
dirs = "6"
getrandom = "0.3"
time = { version = "0.3", features = ["formatting", "macros", "local-offset"] }
anyhow = "1"
mime_guess = "2"
html-escape = "0.2"
similar = "2"
ignore = "0.4"
# A Windows folder without `\\?\` where Windows allows it; nothing elsewhere.
# Already in the tree through tauri and others.
dunce = "1"
# Arenas committed ahead of time, the default (1.15.0 audit, finding 12).
# Tried lazily for 1.17.0 with MIMALLOC_ARENA_EAGER_COMMIT=0
# MIMALLOC_ALLOW_THP=0 on the stock binary: the hook's peak stayed 13.3 MB
# and the daemon's settled rows moved within noise, so it stays as it is.
# The same two variables are the A/B for next time; no build is needed.
mimalloc = { version = "0.1", default-features = false }
# Only for `mi_collect`: a render thread hands back what it freed before it
# goes idle (platform::release_thread_memory). The same library mimalloc links.
libmimalloc-sys = { version = "0.1.49", default-features = false, features = ["extended"] }
toml_edit = "0.25.15"
# A desk's panes: the PTY, the parser that cuts its output into calls, and how
# wide a character is. The screen those calls draw on is snyvi's own, in
# src/screen.rs -- vte is a state machine and nothing more.
portable-pty = "0.9"
vte = "0.15"
unicode-width = "0.2"
# The daemon updating itself (src/update.rs): the manifest's signature, the
# version compare, the downloads' checksums, and the tarballs. sha2, semver
# and flate2 were already in the lock through other crates; tar is small,
# and minisign-verify has no dependencies at all. The Windows zip is read by
# forty lines of its own rather than a crate that brings its compressors.
minisign-verify = "0.2"
semver = "1"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
# A friend's snyvi (src/peer.rs): the daemon's identity and the sealed frame
# two of them pass through the relay. Three primitives and the PAKE, 0.2 MB
# together under the release profile: Ed25519 for the address and the
# signature, X25519 and XChaCha20-Poly1305 for the box, SPAKE2 for the minute
# of pairing over a spoken code. blake3 derives every key; no hkdf, no snow.
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast"] }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets", "precomputed-tables"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
spake2 = "0.4"

[dev-dependencies]
# The router test sends every route a request without a port: tower's
# `ServiceExt::oneshot` on the Router axum already builds on.
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# The bundled SQLite, built for size: 0.89 MB of the static binary, which
# 1.20.0 took to 18.02 MB against its 18 MB budget (src/bench.rs). The
# library holds documents and their search index, not the render path, and
# a send's round trip measured the same either way (177 and 176 ms per MB).
[profile.release.package.libsqlite3-sys]
opt-level = "s"

# Two executables. `snyvi` is everything -- daemon, CLI, MCP server, hook -- and
# never links a browser engine, so it stays static and depends on nothing.
# `snyvi-app` is the native window and nothing else; `snyvi app` finds it and
# hands it a URL. Built separately: the static target cannot link WebKitGTK.
[[bin]]
name = "snyvi"
path = "src/main.rs"

[[bin]]
name = "snyvi-app"
path = "src/bin/app.rs"
required-features = ["desktop"]

[features]
default = []
# Builds the `snyvi-app` window executable. Nothing in `snyvi` is conditional on it.
desktop = [
  "dep:tauri",
  "dep:tauri-build",
  "dep:tauri-plugin-window-state",
  "dep:tauri-plugin-single-instance",
  "dep:tauri-plugin-global-shortcut",
  "dep:tauri-plugin-deep-link",
  "dep:gtk",
]

[dependencies.tauri]
version = "2"
optional = true
default-features = false
# tray-icon for the tray; image-png to decode the mark that the tray and the
# window are handed, which is compiled into the binary rather than looked up
# on disk so a tarball install has no second file to lose.
# dynamic-acl to grant the page its window commands at run time, against
# the daemon origin the window was actually given -- a capability file would
# have to name every port the daemon might be on.
features = ["wry", "tray-icon", "image-png", "dynamic-acl"]

[dependencies.tauri-plugin-window-state]
version = "2"
optional = true

[dependencies.tauri-plugin-single-instance]
version = "2"
optional = true

[dependencies.tauri-plugin-global-shortcut]
version = "2"
optional = true

# Only for registering `snyvi://` with the desktop at runtime, on Linux and
# Windows, so a tarball or zip install answers for the scheme too. Delivery
# of a link is not its job: on Linux and Windows the link arrives on argv,
# through the single-instance plugin, and on macOS as the run loop's Opened
# event, both of which the window handles itself.
[dependencies.tauri-plugin-deep-link]
version = "2"
optional = true

[build-dependencies]
tauri-build = { version = "2", optional = true }

# Only when building on Windows, and only to stamp the icon onto snyvi.exe.
# Cargo matches a build-dependency's target section against the host, so a
# Linux build -- which is every release build of the static binary -- never
# resolves this at all.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# A panel's live folder: macOS answers `proc_pidinfo`, which std does not wrap
# (Linux reads /proc). And on both, `snyvi bench` reads a hook's peak memory
# with `wait4`, the one call that gives a single child's.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The window's own reading of a pasted picture on Linux, where WebKitGTK hands
# a page text and file paths from the clipboard but never an image. Already in
# the tree through tauri's webview; named here so snyvi-app can ask GTK itself.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }

# Only to create the daemon process directly, which is the one thing std's
# Command cannot be asked to do: start something that inherits no handles.
[target.'cfg(windows)'.dependencies]
# Win32_Security is in the list because CreateProcessW takes two security
# descriptors -- both of them null here -- and the binding is gated on the
# feature that defines the type rather than on the one that defines the call.
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
  # For `snyvi bench`, which reads the daemon's working set the way /proc gives
  # it the resident set on Linux.
  "Win32_System_ProcessStatus",
  # For the window's `allow_foreground`, which lets the folder dialog the
  # daemon shows come to the front (src/bin/app.rs).
  "Win32_UI_WindowsAndMessaging",
] }

# The native keychain for the desks' key values: Keychain on macOS, Credential
# Manager on Windows, both a few dozen KB. Linux keeps them in a file only the
# owner reads, beside the token: the pure-Rust Secret Service client is 1.8 MB
# of D-Bus for encryption at rest only, which an unlocked keyring hands to any
# process of the user's anyway (see src/secrets.rs).
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
keyring = "4"
