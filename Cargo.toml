[package]
name = "snyvi"
version = "0.1.0"
edition = "2021"
description = "A fast, beautiful viewer for the documents your agents produce"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-std", "io-util", "sync", "time", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
comrak = { version = "0.39", default-features = false }
syntect = { version = "5", default-features = false, features = ["default-onig", "dump-create"] }
ammonia = "4"
rusqlite = { version = "0.37", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
blake3 = "1"
dirs = "6"
time = { version = "0.3", features = ["formatting", "macros", "local-offset"] }
anyhow = "1"
mime_guess = "2"
html-escape = "0.2"
similar = "2"
ignore = "0.4"
mimalloc = { version = "0.1", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[features]
default = []
# `snyvi app`: a native window (WebKitGTK on Linux) on top of the local daemon.
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-window-state"]

[dependencies.tauri]
version = "2"
optional = true
default-features = false
features = ["wry"]

[dependencies.tauri-plugin-window-state]
version = "2"
optional = true

[build-dependencies]
tauri-build = { version = "2", optional = true }
