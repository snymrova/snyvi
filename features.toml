# What a reader can do now that they couldn't before, one entry each, in the
# PR that ships it (#191). The one source for four places:
#
#   - the What's new page snyvi files after an update (src/whats_new.rs),
#     every entry newer than the version the reader had;
#   - the dot on a new control, for its first fourteen days (ui/guide.js);
#   - the line a panel's Claude is told after an update (src/brief.rs);
#   - the release's notes on GitHub, and so snyvi.com's changelog
#     (scripts/notes.mjs, run by .github/workflows/release.yml).
#
# Keys, every one a "string" on its own line -- scripts/notes.mjs reads this
# file with no TOML library, so nothing fancier:
#
#   id     a few letters, unique
#   since  the version it shipped in
#   title  what it is called, as the window names it
#   line   one or two sentences in the reader's words: what it does for them
#   still  optional: a picture in docs/features/, at the reading column's
#          width; src/features.rs lists every one, and a test holds the two
#          in step
#   show   optional: where it is, for Show me → and the dot: "desk", "doc"
#          or "home", a space, then a selector in that view
#   small  optional, "yes": one line under "Smaller things", no heading
#
# A fix needs no entry. Newest first.

[[feature]]
id = "one-card"
since = "1.64.0"
title = "One card for what's on you"
line = "A card looks and works the same on a desk, in the corner and on Home: a merge keeps Open PR, a key keeps Add key, and a card of questions is one thing, with Other on each and an answer that stays where you gave it. Its x opens Later: tomorrow, next week, already done, or not mine."

[[feature]]
id = "quiet-errands"
since = "1.64.0"
title = "Errands go quiet once you're in the panel"
line = "A command or a key you handled in the panel goes quiet after your next message there, with Done and Still to do, instead of staying amber for days. Home no longer opens the tray over its own list."
small = "yes"

[[feature]]
id = "where-it-waits"
since = "1.64.0"
title = "See where a card waits"
line = "A desk in the sidebar shows how many cards wait on you there, and the panel that asked says asks you in its head: one click opens the tray at its card."
small = "yes"

[[feature]]
id = "routine-wakes"
since = "1.63.0"
title = "Routines that wake when something happens"
line = "A routine can wake on a watch -- a command that prints a line when you're tagged, a build fails or a message arrives -- and run about a minute later with just those ids. Give it several times, each with its own words, and an Only if check that keeps a quiet day quiet, with no session at all."
show = "desk .dk-rts .rt-in"

[[feature]]
id = "routine-runs-with"
since = "1.63.0"
title = "Pick a routine's model and effort"
line = "A routine's sheet has Runs with: its model, its effort, and a lighter context that leaves your global notes out, about half the tokens a run starts with."
small = "yes"

[[feature]]
id = "routine-field"
since = "1.63.0"
title = "A new routine is one field"
line = "Type what runs, a command or your own words, and its sheet asks when, with when it first runs. Try once now takes words too, and a run that can't reach Claude says so in 90 seconds."
small = "yes"

[[feature]]
id = "share"
since = "1.62.0"
title = "Your page, shared where your people are"
line = "Once it's up, Copy link and Post it… open your own X, Bluesky or LinkedIn with the words in. Each moment has an address of its own, every link shows a picture where it's pasted, and anyone can follow your page by feed. Follows from Home now reach the builder, and once a day you hear who follows and how many opened your page."

[[feature]]
id = "badge"
since = "1.62.0"
title = "A badge for the README"
line = "Once your page is on the wall, Page offers one line for your README: a badge with its name and hearts that opens the page. Claude in the panel can add it, or push the check that puts the page on the wall."
small = "yes"

[[feature]]
id = "boards"
since = "1.62.0"
title = "Many boards, each an empty canvas"
line = "Make a board from the desk's ⋯ (New board) and ask Claude to draw on it: screens, cards, a page, each a section as tall as its content, in one light document however many there are. Switch boards and rename them from the board's title."

[[feature]]
id = "pagebuild"
since = "1.62.0"
title = "Claude builds your page"
line = "Page says what it is before anything else, and Ask Claude to build it fills the title, the lede, a main link, three points and the story from your project, in a cleaner template. You still choose who sees it and press Publish."

[[feature]]
id = "viewsay"
since = "1.62.0"
title = "Each view says what it is"
line = "An empty board, a desk without a page and the Folder view each say, once, what they are for, and Ask Claude types into the panel beside them when its Claude is at its prompt."
small = "yes"

[[feature]]
id = "draftpost"
since = "1.61.0"
title = "Claude drafts the post"
line = "After something ships, ask Claude in a panel to plan the launch or draft the post: /snyvi:launch puts the steps on the desk as dated lines, and /snyvi:post drafts Show HN, Reddit or the release note by that channel's rules, with the hour and the title's length checked. Claude never posts; you do, and tick the line with the link."

[[feature]]
id = "liveframe"
since = "1.61.0"
title = "A board frame with live numbers"
line = "A frame on a board can show what this desk shipped and told, kept current by snyvi as threads move. Ask Claude to make one; it never reaches the network."
small = "yes"

[[feature]]
id = "drawerhead"
since = "1.60.1"
title = "One ✕ on a panel in the back"
line = "A panel in the back opens with its own head: Bring forward, ⌄ to put the drawer down while it keeps running, and ✕ to close it. The drawer's second ✕ is gone."
small = "yes"

[[feature]]
id = "lanes"
since = "1.60.1"
title = "Everything at a row's end in one lane"
line = "The sidebar's and the desk rail's buttons, counts and dots stand in columns: a head's + over its rows' ✕, the top bar's icons over both. The Desks list keeps your own order, with no sort button."
small = "yes"

[[feature]]
id = "viewsmenu"
since = "1.60.0"
title = "Views live in the desk's ⋯"
line = "Panels, Folder, Page and your boards are in the desk's ⋯ menu now, so the head stays quiet. While one is open, a chip in the head takes you back; Ctrl Alt F opens Folder."
show = "desk .dk-head .dk-menu"

[[feature]]
id = "dockbelow"
since = "1.60.0"
title = "Your panel below the view"
line = "In Folder, a board and Page your panel sits below, so files and frames get the width. Fold it to its head and click it to bring it back, drag its edge, or put it beside; each desk remembers."

[[feature]]
id = "folderroom"
since = "1.60.0"
title = "Folder keeps the desk around it"
line = "Folder keeps the desk's head, tabs and edges where the desk has them, and a board's own folder offers Open as board. A board's frames and colours sit on the board itself."

[[feature]]
id = "openview"
since = "1.60.0"
title = "Claude can show you a file"
line = "Ask Claude to show you what it changed, and once you say yes it opens Folder at that file, with its panel below it."

[[feature]]
id = "quiethead"
since = "1.60.0"
title = "A quieter desk head"
line = "Where you left off sits in a box of its own and says whose the next step is, a panel shows its full view and close only when it has the focus, + tab and + panel say which is which, and you rename a panel by double-clicking its name."
small = "yes"

[[feature]]
id = "gostart"
since = "1.59.1"
title = "Approve starts a waiting panel"
line = "Approve a plan on its desk and, if its Claude is waiting at its prompt, snyvi tells it to go ahead there and then. Approved from elsewhere, the note's line reads approved · start Claude: press it."
small = "yes"

[[feature]]
id = "latersteps"
since = "1.59.1"
title = "Every step of a run card has Copy"
line = "A run card's later steps have Copy and Done too, so you can take a command along or skip one you already did. Run stays on the step whose turn it is."
small = "yes"

[[feature]]
id = "wall"
since = "1.59.0"
title = "What people are building"
line = "Home shows what other builders are working on, newest moment first, with a heart to say you'd use it, read it or try it. Put your own desk's page there from Page in its head, when you press Publish and not before."
still = "wall.png"
show = "home [data-w=wall]"

[[feature]]
id = "page"
since = "1.59.0"
title = "Your desk's page"
line = "Page, beside Folder in a desk's head, drafts a landing page from the desk: its README, its logo and colour, its repository and its moments. Edit it where it stands, then send it to the wall or to friends only, and take it down whenever you like."
still = "page.png"
show = "desk .dk-head .dk-menu"

[[feature]]
id = "board"
since = "1.58.0"
title = "A board beside your panel"
line = "Ask Claude to design something and it draws on a board in your desk's folder, frame by frame, while you watch. Pick a frame and say what to change: Claude reads what you picked. The panel you talk to stays docked with the board."
show = "desk .dk-head .dk-menu"

[[feature]]
id = "restore"
since = "1.58.0"
title = "Everything back after a crash"
line = "When snyvi is killed with conversations open -- the system out of memory, a power cut -- the next start offers them back. Home says so in its first line, with Restore all and Choose…, and each panel's strip says Claude was open there. They come back two at a time, fewer when memory is short, the desk you are on first."

[[feature]]
id = "checks"
since = "1.58.0"
title = "Checks you hold on a note"
line = "A note can carry a few lines of what you will try once its work is done. Open a note and press Hold a check…; the agent building it is told only how many you hold, never what they say. When the work lands, the note lists them with a ✓ and ✗ each: works lights once every line passes, and a ✗ reopens the note with that line's words for the next agent."

[[feature]]
id = "tabs"
since = "1.57.0"
title = "Tabs in a desk"
line = "A desk can hold tabs, one for each part of a project, each with its own panels in the desk's folder. The + after the desk's name makes one, a double-click renames it and its ✕ closes it with an Undo. Their panels keep running while you work in another, and a tab whose panel needs you says so. Ctrl Alt Shift [ and ] switch."
show = "desk .dk-group-new"

[[feature]]
id = "deskfolder"
since = "1.56.0"
title = "A desk opens its own folder"
line = "A desk's row in the sidebar has a folder button (in its head until 1.57): it shows the folder over the desk, its tree beside the file you read, with Find and git's M and A on what is changed, and remembers what you unfolded, where you were and the last file you read. Folders left the sidebar: a folder is read through its desk."
show = "desk #side [data-deskdir]"

[[feature]]
id = "change"
since = "1.56.0"
title = "The change on the desk"
line = "What a panel is building has a row of its own at the head of Notes: its name, its stage (click to move it), the panel at it, its PR and checks. The chip on the panel's row points to it."
show = "desk .dk-change"

[[feature]]
id = "gate"
since = "1.56.0"
title = "Approve says what it starts"
line = "A plan's Approve is a block under its title: which notes it plans, which panel hears it, and what happens next. On the desk, a click on a note opens the same: its plan, Approve, its thread, its checks."
show = "doc .doc-gate"

[[feature]]
id = "stagewords"
since = "1.56.0"
title = "Notes say where they are"
line = "Under a note, words instead of a tag: planned · waiting for your Approve, shipped in 1a2b3c4 · works?, read by Claude · not planned yet. Home says the same beside each note."
show = "desk .dk-stage.words"

[[feature]]
id = "weekline"
since = "1.56.0"
title = "This week in Home's head"
line = "Home's head says what moved this week, ticked and committed, and opens the log."
small = "yes"

[[feature]]
id = "updatesays"
since = "1.56.0"
title = "The version says when the check fails"
line = "An amber dot on the version at the sidebar's foot, and why: no network, or the release not there yet."
small = "yes"

[[feature]]
id = "routinefields"
since = "1.56.0"
title = "A routine is what, and when"
line = "A new routine is two fields: the command or your words, and when it runs."
small = "yes"

[[feature]]
id = "music"
since = "1.55.0"
title = "Music while you work"
line = "Press ♪ beside Search for focus, lo-fi, calm, Indian classical and bhajan stations, a stream of your own, or the music folder you already have. It plays on as you move between documents and desks."
show = "home [data-media=music]"

[[feature]]
id = "inbox-list"
since = "1.55.0"
title = "The Inbox is one list"
line = "Every document, newest first, with its project under its title. Type in Find a document to narrow it, click a project's name to see that project alone, or use the funnel to see only what's waiting."
show = "home .ib-find"

[[feature]]
id = "onyou"
since = "1.54.0"
title = "On you is everything that's yours"
line = "One list on every page, in the corner: Claude's asks, a dated line, a routine's line from this morning, a plan to approve, a left-off waiting on you, each with its document and the one button for its step. It opens by itself the first time you arrive each day."
show = "home .hm-wait"

[[feature]]
id = "goahead"
since = "1.54.0"
title = "Go ahead, Tomorrow, Not this"
line = "On a routine's line, Go ahead lets it carry on inside its Waits without opening its panel. The ✕ on a row asks: Tomorrow, Next week, or Not this with a word, which Claude hears so it does not ask again."
small = "yes"

[[feature]]
id = "linedoc"
since = "1.54.0"
title = "A line carries its document"
line = "Paste a document's link after a note and the note carries it: its card and its row in On you open and copy it."
small = "yes"

[[feature]]
id = "html-fill"
since = "1.54.0"
title = "HTML pages fill the screen"
line = "An HTML document has Full screen beside Width and Copy, or press f. Esc gives the column back."
small = "yes"

[[feature]]
id = "routine-late"
since = "1.54.0"
title = "A routine says how late it ran"
line = "A routine that caught up after the laptop slept says how late it ran, on its row and in its history, and time asleep no longer counts against its minutes."
small = "yes"

[[feature]]
id = "download-open"
since = "1.53.1"
title = "A download says where it went"
line = "Press Download on a picture, a film, a song or a PDF and snyvi says where it saved it, with Open and Show in folder right beside."
small = "yes"

[[feature]]
id = "agent-ticks"
since = "1.53.1"
title = "Claude ticks its own notes"
line = "When a Claude finishes a note and checks it, it ticks it, with the commit. Until the work is on main the note says on a branch; if it isn't right, press not yet… under it and say what's wrong."
small = "yes"

[[feature]]
id = "friend-lines-on-you"
since = "1.53.1"
title = "A friend's line is on you"
line = "A line from a friend waits in On you on every page and desk, with Keep on, until you keep it or remove it, and your desktop says when one or a document comes while snyvi is behind another app."
small = "yes"

[[feature]]
id = "routines-easier"
since = "1.53.1"
title = "Routines are easier to start"
line = "Click the Routines field and your commands and skills are listed, with how to say when. The sheet says plainly what it does, when, and what it asks you before; Try once now comes first."
show = "desk .dk-rts .rt-in"

[[feature]]
id = "routines-field"
since = "1.53.0"
title = "Routines have a field of their own"
line = "Type / to pick a command or a skill, or write your own words, and say when. Try it once while you watch, then Start it, and it comes back at its hour."
show = "desk .dk-rts .rt-in"

[[feature]]
id = "copy-markdown"
since = "1.53.0"
title = "Copy keeps the Markdown"
line = "Copy part of a Markdown page and paste it into Claude, a terminal or GitHub with its bullets, headings, tables and code intact. Hover a heading for a glyph that copies its whole section."

[[feature]]
id = "whats-new"
since = "1.52.0"
title = "What's new"
line = "After an update, snyvi files a What's new page: what changed since the version you had, each with Show me →. A dot marks each new control until you've used it."

[[feature]]
id = "first-steps"
since = "1.52.0"
title = "The first three steps"
line = "A new desk shows you the three moments that matter: connect Claude, ask it something, read its page and answer. Welcome's ▶ Watch it plays the whole loop in twenty seconds."

[[feature]]
id = "brief-news"
since = "1.52.0"
title = "Claude hears what's new"
line = "After an update, the Claude in a panel is told what changed, and the instructions snyvi gives it are brought up to date."
small = "yes"

[[feature]]
id = "download"
since = "1.51.0"
title = "Save a picture, a film or a song"
line = "Download sits in the media bar, and over any picture or film in a page. The file lands where your downloads go."

[[feature]]
id = "back-to-sender"
since = "1.51.0"
title = "Back to the panel that sent it"
line = "A page's ✕ names the panel that sent it, and takes you there, even a panel in the back."

[[feature]]
id = "diagrams"
since = "1.51.0"
title = "Diagrams you can read"
line = "No diagram opens too small to read. A long flow is drawn top-down, and Turn puts it back."

[[feature]]
id = "find-files"
since = "1.51.0"
title = "⌘K finds files"
line = "Ctrl K (⌘K on a Mac) finds files by name in your desks' folders, under the documents. Start with f: for files alone."

[[feature]]
id = "corner-still"
since = "1.51.0"
title = "A card or a toast holds still while you reach for it"
line = "A card or a toast holds still while you reach for it."
small = "yes"

[[feature]]
id = "chime"
since = "1.51.0"
title = "The chime always comes with a card that says what it was, and has its own switch"
line = "The chime always comes with a card that says what it was, and has its own switch."
small = "yes"

[[feature]]
id = "routines"
since = "1.50.0"
title = "Routines"
line = "A line that comes back. Type check-seedlings · every day 07:30 in a desk's notes, and snyvi runs that command at that hour, in a panel in the back. What it did waits for you on Home."
still = "routines.png"
show = "desk .dk-rts .rt-in"

[[feature]]
id = "undo-waits"
since = "1.50.0"
title = "An Undo waits until the ✕ it undoes is done"
line = "An Undo waits until the ✕ it undoes is done."
small = "yes"

[[feature]]
id = "in-back"
since = "1.49.0"
title = "Panels in the back"
line = "Run something without giving it a panel. A dev server or a watcher runs in the back, and the desk says when it needs you."
still = "inback.png"
show = "desk [data-a=back-new]"

[[feature]]
id = "friends-sturdier"
since = "1.49.0"
title = "Sending to a friend got sturdier"
line = "Sending to a friend got sturdier."
small = "yes"

[[feature]]
id = "pdf"
since = "1.48.0"
title = "Any page as a PDF"
line = "Save as PDF sits at the top of every page, next to Copy all. Ctrl P (⌘P on a Mac) does the same."
show = "doc #btn-pdf-top"

[[feature]]
id = "back-to-panels"
since = "1.48.0"
title = "A ✕ on a page takes you back to the panel you came from"
line = "A ✕ on a page opened from a desk takes you back to the panel you came from."
small = "yes"

[[feature]]
id = "dates"
since = "1.47.0"
title = "Dates on notes"
line = "Put · fri after a note and it's due Friday. Home lists what's due, so nothing slips."
still = "dates.png"
show = "desk .dk-note.new"

[[feature]]
id = "approve"
since = "1.47.0"
title = "Approve a plan on its page"
line = "A plan Claude sends for your go-ahead has Approve at its head, and the panel that wrote it hears your answer."
