name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.0 (creates tag v<version>)"
        required: true
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            cc: musl-gcc
            deb_arch: amd64
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            cc: musl-gcc
            deb_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - name: Build static binary
        env:
          CC_x86_64_unknown_linux_musl: ${{ matrix.cc }}
          CC_aarch64_unknown_linux_musl: ${{ matrix.cc }}
        run: cargo build --release --target ${{ matrix.target }}
      - name: Smoke test
        run: |
          B=target/${{ matrix.target }}/release/snyvi
          file $B
          SNYVI_DATA_DIR=/tmp/s SNYVI_CONFIG_DIR=/tmp/c SNYVI_PORT=7802 $B send README.md
          SNYVI_BENCH_FACTOR=3 $B bench --check
      - name: Package
        run: |
          version="${{ github.event.inputs.version || github.ref_name }}"
          version="${version#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          name=snyvi-$version-${{ matrix.target }}
          mkdir -p dist/$name
          cp target/${{ matrix.target }}/release/snyvi README.md dist/$name/
          tar -C dist -czf dist/$name.tar.gz $name
          (cd dist && sha256sum $name.tar.gz > $name.tar.gz.sha256)
      - name: Package .deb
        run: |
          version="${{ github.event.inputs.version || github.ref_name }}"
          deb=$(packaging/deb.sh target/${{ matrix.target }}/release/snyvi "${version#v}" ${{ matrix.deb_arch }} dist)
          dpkg-deb -I "$deb"
          sudo dpkg -i "$deb"
          test "$(command -v snyvi)" = /usr/bin/snyvi
          snyvi --version
          (cd dist && sha256sum "$(basename "$deb")" > "$(basename "$deb").sha256")
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.sha256
          generate_release_notes: true
