name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.0 (creates tag v<version>)"
        required: true
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            cc: musl-gcc
            deb_arch: amd64
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            cc: musl-gcc
            deb_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: The tag must name the version in Cargo.toml
        # v0.6.0 was first pushed onto a commit whose Cargo.toml still said
        # 0.5.0, from a clone that had not fetched the release it was naming.
        # The run built the previous release and labelled it as the new one,
        # and nothing downstream could tell: this workflow reads the version
        # from the tag, Tauri and the crate read it from Cargo.toml, and each
        # was individually correct. Checked first, before anything is built.
        run: |
          version="${{ github.event.inputs.version || github.ref_name }}"
          version="${version#v}"
          manifest=$(sed -n '0,/^version = "/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          test "$version" = "$manifest" || {
            echo "the tag says $version but Cargo.toml says $manifest."
            echo "bump Cargo.toml first, then move the tag onto that commit."
            exit 1; }
          echo "releasing $version"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - name: Build static binary
        env:
          CC_x86_64_unknown_linux_musl: ${{ matrix.cc }}
          CC_aarch64_unknown_linux_musl: ${{ matrix.cc }}
        run: cargo build --release --target ${{ matrix.target }}
      - name: Smoke test
        run: |
          B=target/${{ matrix.target }}/release/snyvi
          file $B
          SNYVI_DATA_DIR=/tmp/s SNYVI_CONFIG_DIR=/tmp/c SNYVI_PORT=7802 $B send README.md
          SNYVI_BENCH_FACTOR=3 $B bench --check
      - name: Package
        run: |
          version="${{ github.event.inputs.version || github.ref_name }}"
          version="${version#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          name=snyvi-$version-${{ matrix.target }}
          mkdir -p dist/$name
          cp target/${{ matrix.target }}/release/snyvi README.md dist/$name/
          tar -C dist -czf dist/$name.tar.gz $name
          (cd dist && sha256sum $name.tar.gz > $name.tar.gz.sha256)
      - name: Package .deb
        run: |
          version="${{ github.event.inputs.version || github.ref_name }}"
          deb=$(packaging/deb.sh target/${{ matrix.target }}/release/snyvi "${version#v}" ${{ matrix.deb_arch }} dist)
          dpkg-deb -I "$deb"
          sudo dpkg -i "$deb"
          test "$(command -v snyvi)" = /usr/bin/snyvi
          snyvi --version
          (cd dist && sha256sum "$(basename "$deb")" > "$(basename "$deb").sha256")
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.sha256
          # Both matrix legs upload to one release, and each call that asks for
          # notes appends another copy; v0.5.0 went out with the changelog line
          # twice. One leg authors the notes, the other only adds its files.
          generate_release_notes: ${{ matrix.deb_arch == 'amd64' }}

  desktop:
    # The native window, as an add-on to the static package rather than a second
    # copy of snyvi. Only this one executable links WebKitGTK, so only this one
    # is dynamically linked and tied to a glibc baseline; snyvi itself ships
    # from the matrix above, static, for both architectures.
    #
    # Built on the oldest release it supports so that baseline is as low as it
    # goes: 22.04 records libc6 (>= 2.34), which covers Ubuntu 22.04 and later
    # and Debian 12 and later. The dependencies themselves are read out of the
    # binary by dpkg-shlibdeps in packaging/deb.sh, so they are never a guess.
    #
    # amd64 only for now. The arm64 runners are 24.04, which would record a
    # glibc baseline excluding every distribution older than that. Now that the
    # window is one small executable and snyvi itself is static everywhere, an
    # arm64 add-on costs only its own oldest-host runner.
    #
    # After `build`, because both jobs upload to the same release: running them
    # in sequence keeps two writers off one release, and lets the static
    # package's job be the one that authors the notes.
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: WebKitGTK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev xvfb dpkg-dev
      - name: Build
        run: cargo build --release --features desktop
      - name: Smoke test
        # 124 is the timeout firing, which means the window stayed up. A release
        # that ships a window nobody opened is the whole reason this job exists.
        run: |
          set -e
          file target/release/snyvi target/release/snyvi-app
          # snyvi must not have gained an engine; the window must have one.
          ldd target/release/snyvi | grep -q webkit && { echo "snyvi links webkit"; exit 1; } || true
          ldd target/release/snyvi-app | grep -q webkit || { echo "snyvi-app lacks webkit"; exit 1; }
          export SNYVI_DATA_DIR=/tmp/s-d SNYVI_CONFIG_DIR=/tmp/c-d SNYVI_PORT=7803
          xvfb-run -a -s "-screen 0 1280x860x24" timeout 20 ./target/release/snyvi app > /tmp/app.log 2>&1 || code=$?
          test "${code:-0}" = "124" || { echo "window exited early:"; cat /tmp/app.log; exit 1; }
          grep -q "install snyvi-app" /tmp/app.log && { echo "fell back to a browser"; exit 1; } || true
          ./target/release/snyvi stop
      - name: Package
        # The tarball carries the one executable; whoever unpacks it puts it
        # beside their snyvi, which is where `snyvi app` looks first.
        run: |
          version="${{ github.event.inputs.version || github.ref_name }}"
          version="${version#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          name=snyvi-app-$version-x86_64-linux
          mkdir -p dist/$name
          cp target/release/snyvi-app README.md dist/$name/
          tar -C dist -czf dist/$name.tar.gz $name
          (cd dist && sha256sum $name.tar.gz > $name.tar.gz.sha256)
          deb=$(packaging/deb.sh --desktop target/release/snyvi-app "$version" amd64 dist)
          dpkg-deb -I "$deb"
          # Installing it must pull in snyvi rather than replace it, but the
          # static package is not in an apt repository, so satisfy it from the
          # matrix job's artifact is not possible here; check the field instead.
          dpkg-deb -f "$deb" Depends | grep -q "snyvi (= $version)"
          (cd dist && sha256sum "$(basename "$deb")" > "$(basename "$deb").sha256")
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.sha256

  windows:
    # One job and one artifact. The split on Linux exists because a static musl
    # binary cannot link WebKitGTK; Windows has no such fork -- snyvi.exe links
    # no engine, and snyvi-app.exe uses WebView2, which is part of the
    # operating system on Windows 10 and 11 rather than a package to depend on.
    # So the zip carries both, and installing the window is not a second step.
    #
    # After `desktop` for the same reason `desktop` is after `build`: three
    # jobs upload to one release, and running them in sequence keeps two
    # writers off it.
    needs: desktop
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        # Two passes. snyvi must not be built with the desktop feature, so that
        # tauri's build script cannot follow it into a binary that never opens
        # a window -- and because build.rs only attaches snyvi.exe's own icon
        # resource when the feature is off.
        run: |
          cargo build --release --bin snyvi
          cargo build --release --bin snyvi-app --features desktop
      - name: Smoke test
        shell: bash
        run: |
          set -e
          export SNYVI_DATA_DIR="$RUNNER_TEMP/s" SNYVI_CONFIG_DIR="$RUNNER_TEMP/c" SNYVI_PORT=7804
          ./target/release/snyvi.exe send README.md
          SNYVI_BENCH_FACTOR=3 ./target/release/snyvi.exe bench --check
          # The window, from the copy about to be shipped. A release that
          # contains a window nobody opened is what the desktop job exists to
          # prevent, and that goes double for the one platform where the window
          # is in the same download as everything else.
          ./target/release/snyvi.exe app > "$RUNNER_TEMP/app.log" 2>&1 &
          sleep 20
          tasklist //FI "IMAGENAME eq snyvi-app.exe" | grep -q snyvi-app.exe || {
            echo "no native window is running:"; cat "$RUNNER_TEMP/app.log"; exit 1; }
          taskkill //F //IM snyvi-app.exe
          ./target/release/snyvi.exe stop
      - name: Package
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version || github.ref_name }}" -replace '^v', ''
          Add-Content -Path $env:GITHUB_ENV -Value "VERSION=$version"
          $name = "snyvi-$version-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item target/release/snyvi.exe, target/release/snyvi-app.exe, README.md "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          # Written as sha256sum writes it -- two spaces, a bare filename, a
          # single newline -- so `sha256sum -c` reads this one like the others.
          $file = "dist/$name.zip"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText((Join-Path (Resolve-Path "dist") "$name.zip.sha256"), "$hash  $name.zip`n")
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.zip
            dist/*.sha256
