name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.0 (creates tag v<version>)"
        required: true
      hotfix_below:
        description: "Machines running anything older than this apply at their next check rather than their next daily slot. Empty on an ordinary release."
        required: false
        default: ""
      dry_run:
        description: "Build every download onto a draft, write and sign latest.json, and stop there: nothing is published"
        type: boolean
        default: false

# A daemon updates itself from what this workflow publishes, so the workflow
# has to be trustworthy in a way a hand-run download never needed it to be.
# The shape: `create` opens one draft release; every build leg uploads onto
# that draft, in parallel; `publish` checks that every download the manifest
# will name is there, writes latest.json from their checksums, signs it, and
# only then flips the draft public. A reader, or a daemon, never sees a
# release with a download still missing. Before this the release was public
# the moment its first leg finished, some forty minutes before its last
# asset landed, and v1.5.0 had no assets at all for its first four minutes.
permissions:
  contents: write
  # Provenance: each leg attests the files it built, so `gh attestation
  # verify <file> --repo snymrova/snyvi` proves a download came out of this
  # workflow on the commit the tag names. Orthogonal to the minisign
  # signature over latest.json, which is what the daemon checks.
  id-token: write
  attestations: write

# One run per version at a time: a tag push racing a workflow_dispatch for the
# same version would otherwise share a draft and clobber each other's uploads.
# One group name for both, `release-v<version>`: the dispatch input comes
# without its v as often as with, and the tag push's ref always has one, so
# the two used to land in different groups and race after all.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && (startsWith(inputs.version, 'v') && format('release-{0}', inputs.version) || format('release-v{0}', inputs.version)) || format('release-{0}', github.ref_name) }}
  cancel-in-progress: false

jobs:
  create:
    # The one job that decides the version and opens the release. Everything
    # else takes the version from here rather than deriving it again.
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: The tag must name the version in Cargo.toml
        id: version
        # v0.6.0 was first pushed onto a commit whose Cargo.toml still said
        # 0.5.0, from a clone that had not fetched the release it was naming.
        # The run built the previous release and labelled it as the new one,
        # and nothing downstream could tell: this workflow reads the version
        # from the tag, Tauri and the crate read it from Cargo.toml, and each
        # was individually correct. Checked first, before anything is built.
        run: |
          version="${{ github.event.inputs.version || github.ref_name }}"
          version="${version#v}"
          manifest=$(sed -n '0,/^version = "/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          test "$version" = "$manifest" || {
            echo "the tag says $version but Cargo.toml says $manifest."
            echo "bump Cargo.toml first, then move the tag onto that commit."
            exit 1; }
          echo "releasing $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: One draft, reused on a re-run
        # A draft has no tag yet on a workflow_dispatch; GitHub creates the
        # tag at the target when the draft is published, which is what the
        # old target_commitish did. `gh` finds a draft by its tag name, so
        # the legs can upload to it and `publish` can edit it. A version that
        # is already public is not built again: a release is cut once, and a
        # re-run of a failed job after `publish` does not come through here.
        # A draft is reused only when it was opened on this same commit: a
        # dry run left from an earlier one would otherwise keep that commit's
        # downloads under --clobber for any leg that did not run again, and a
        # release would ship two builds. Deleted, then opened afresh.
        run: |
          v="v${{ steps.version.outputs.version }}"
          if info=$(gh release view "$v" --json isDraft,targetCommitish -q '"\(.isDraft) \(.targetCommitish)"' 2>/dev/null); then
            read -r draft target <<< "$info"
            if [ "$draft" != "true" ]; then
              echo "$v is already published; a release is cut once."
              exit 1
            fi
            if [ "$target" = "$GITHUB_SHA" ]; then
              echo "reusing the draft $v"; exit 0
            fi
            echo "the draft $v was opened on $target, not $GITHUB_SHA; deleting it"
            gh release delete "$v" --yes
          fi
          gh release create "$v" --draft --generate-notes --title "$v" --target "$GITHUB_SHA"

  build:
    needs: create
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            cc: musl-gcc
            deb_arch: amd64
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            cc: musl-gcc
            deb_arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.create.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - name: Build static binary
        env:
          CC_x86_64_unknown_linux_musl: ${{ matrix.cc }}
          CC_aarch64_unknown_linux_musl: ${{ matrix.cc }}
        run: cargo build --release --target ${{ matrix.target }}
      - name: Smoke test
        run: |
          B=target/${{ matrix.target }}/release/snyvi
          file $B
          SNYVI_DATA_DIR=/tmp/s SNYVI_CONFIG_DIR=/tmp/c SNYVI_PORT=7802 $B send README.md
          SNYVI_BENCH_FACTOR=3 $B bench --check
      - name: Package
        run: |
          name=snyvi-$VERSION-${{ matrix.target }}
          mkdir -p dist/$name
          cp target/${{ matrix.target }}/release/snyvi README.md dist/$name/
          tar -C dist -czf dist/$name.tar.gz $name
          (cd dist && sha256sum $name.tar.gz > $name.tar.gz.sha256)
      - name: Package .deb
        run: |
          deb=$(packaging/deb.sh target/${{ matrix.target }}/release/snyvi "$VERSION" ${{ matrix.deb_arch }} dist)
          echo "DEB=$deb" >> "$GITHUB_ENV"
          dpkg-deb -I "$deb"
          sudo dpkg -i "$deb"
          test "$(command -v snyvi)" = /usr/bin/snyvi
          snyvi --version
          (cd dist && sha256sum "$(basename "$deb")" > "$(basename "$deb").sha256")
      - name: The same downloads, under names that do not move
        # The README links straight at a file: /releases/latest/download/<name>,
        # which GitHub resolves only for an exact asset name. A name with the
        # version in it therefore goes stale the day the next release is cut,
        # and the README would have to be rewritten on every tag to keep its
        # own download links alive. A copy under a fixed name is what makes
        # that link permanent instead. The version-stamped originals stay and
        # are still the canonical ones: they are what the cask reads, what a
        # checksum is published against, and what a file should be called once
        # it is sitting in somebody's downloads folder. The fixed names are
        # also what latest.json carries, so a daemon updating itself never
        # has a version in a file name, only in the manifest.
        run: |
          case "${{ matrix.deb_arch }}" in amd64) arch=x64;; *) arch=arm64;; esac
          cp "dist/snyvi-$VERSION-${{ matrix.target }}.tar.gz" "dist/snyvi-linux-$arch.tar.gz"
          cp "$DEB" "dist/snyvi-linux-$arch.deb"
          (cd dist && sha256sum "snyvi-linux-$arch.tar.gz" > "snyvi-linux-$arch.tar.gz.sha256")
          (cd dist && sha256sum "snyvi-linux-$arch.deb" > "snyvi-linux-$arch.deb.sha256")
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
      - name: Onto the draft
        run: gh release upload "v$VERSION" dist/*.tar.gz dist/*.deb dist/*.sha256 --clobber

  desktop:
    # The native window, as an add-on to the static package rather than a second
    # copy of snyvi. Only this one executable links WebKitGTK, so only this one
    # is dynamically linked and tied to a glibc baseline; snyvi itself ships
    # from the matrix above, static, for both architectures.
    #
    # Built on the oldest release it supports so that baseline is as low as it
    # goes: 22.04 records libc6 (>= 2.34), which covers Ubuntu 22.04 and later
    # and Debian 12 and later. The dependencies themselves are read out of the
    # binary by dpkg-shlibdeps in packaging/deb.sh, so they are never a guess.
    #
    # Both architectures, each on its own oldest host: the window is one small
    # executable, so an arm64 add-on costs only the 22.04 arm runner that keeps
    # its baseline the same as amd64's. Until 0.16 it was amd64 only, because
    # the only arm runners were 24.04 and a package built there would have
    # excluded every distribution older than that.
    #
    # Beside `build` rather than after it: the legs used to run in sequence
    # to keep two writers off one public release, and the release took as
    # long as all of them added up. Now they upload to a draft, each its own
    # files, and the release takes as long as the slowest.
    needs: create
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            deb_arch: amd64
            name: x86_64-linux
          - runner: ubuntu-22.04-arm
            deb_arch: arm64
            name: aarch64-linux
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.create.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: WebKitGTK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev xvfb dpkg-dev
      - name: Build
        run: cargo build --release --features desktop
      - name: Smoke test
        # 124 is the timeout firing, which means the window stayed up. A release
        # that ships a window nobody opened is the whole reason this job exists.
        run: |
          set -e
          file target/release/snyvi target/release/snyvi-app
          # snyvi must not have gained an engine; the window must have one.
          ldd target/release/snyvi | grep -q webkit && { echo "snyvi links webkit"; exit 1; } || true
          ldd target/release/snyvi-app | grep -q webkit || { echo "snyvi-app lacks webkit"; exit 1; }
          export SNYVI_DATA_DIR=/tmp/s-d SNYVI_CONFIG_DIR=/tmp/c-d SNYVI_PORT=7803
          xvfb-run -a -s "-screen 0 1280x860x24" timeout 20 ./target/release/snyvi app > /tmp/app.log 2>&1 || code=$?
          test "${code:-0}" = "124" || { echo "window exited early:"; cat /tmp/app.log; exit 1; }
          grep -q "no native window" /tmp/app.log && { echo "fell back to a browser"; exit 1; } || true
          ./target/release/snyvi stop
      - name: Package
        # The tarball carries the one executable; whoever unpacks it puts it
        # beside their snyvi, which is where `snyvi app` looks first.
        run: |
          name=snyvi-app-$VERSION-${{ matrix.name }}
          mkdir -p dist/$name
          cp target/release/snyvi-app README.md dist/$name/
          tar -C dist -czf dist/$name.tar.gz $name
          (cd dist && sha256sum $name.tar.gz > $name.tar.gz.sha256)
          deb=$(packaging/deb.sh --desktop target/release/snyvi-app "$VERSION" ${{ matrix.deb_arch }} dist)
          dpkg-deb -I "$deb"
          # Installing it must pull in snyvi rather than replace it, but the
          # static package is not in an apt repository, so satisfy it from the
          # matrix job's artifact is not possible here; check the field instead.
          dpkg-deb -f "$deb" Depends | grep -q "snyvi (= $VERSION)"
          (cd dist && sha256sum "$(basename "$deb")" > "$(basename "$deb").sha256")
          # Names that do not carry the version, so the README can link the
          # .deb at /releases/latest/download/ the way it links everything
          # else, and so latest.json can name the tarball: a daemon on the
          # per-user install swaps snyvi-app beside snyvi from this one.
          # Without the first, the window -- the half of snyvi that desks
          # need -- was the one download a reader could not be given a
          # straight link to, and the README sent them to the release page
          # to find it by eye.
          arch=$([ "${{ matrix.deb_arch }}" = amd64 ] && echo x64 || echo arm64)
          cp "$deb" "dist/snyvi-app-linux-$arch.deb"
          cp "dist/$name.tar.gz" "dist/snyvi-app-linux-$arch.tar.gz"
          (cd dist && sha256sum "snyvi-app-linux-$arch.deb" > "snyvi-app-linux-$arch.deb.sha256")
          (cd dist && sha256sum "snyvi-app-linux-$arch.tar.gz" > "snyvi-app-linux-$arch.tar.gz.sha256")
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
      - name: Onto the draft
        run: gh release upload "v$VERSION" dist/*.tar.gz dist/*.deb dist/*.sha256 --clobber

  windows:
    # One job and one artifact. The split on Linux exists because a static musl
    # binary cannot link WebKitGTK; Windows has no such fork -- snyvi.exe links
    # no engine, and snyvi-app.exe uses WebView2, which is part of the
    # operating system on Windows 10 and 11 rather than a package to depend on.
    # So the zip carries both, and installing the window is not a second step.
    needs: create
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.create.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        # Two passes. snyvi must not be built with the desktop feature, so that
        # tauri's build script cannot follow it into a binary that never opens
        # a window -- and because build.rs only attaches snyvi.exe's own icon
        # resource when the feature is off.
        run: |
          cargo build --release --bin snyvi
          cargo build --release --bin snyvi-app --features desktop
      - name: Smoke test
        shell: bash
        run: |
          set -e
          export SNYVI_DATA_DIR="$RUNNER_TEMP/s" SNYVI_CONFIG_DIR="$RUNNER_TEMP/c" SNYVI_PORT=7804
          ./target/release/snyvi.exe send README.md
          # SNYVI_BENCH_SHARED, as ci.yml has had for this runner: a hosted
          # Windows runner creates a process in ~400 ms against a 300 ms
          # budget, and that row is the operating system's, not snyvi's. The
          # 0.19 release stopped here on exactly that, with no Windows zip
          # and no .app after it.
          SNYVI_BENCH_SHARED=1 SNYVI_BENCH_FACTOR=3 ./target/release/snyvi.exe bench --check
          # The window, from the copy about to be shipped. A release that
          # contains a window nobody opened is what the desktop job exists to
          # prevent, and that goes double for the one platform where the window
          # is in the same download as everything else.
          ./target/release/snyvi.exe app > "$RUNNER_TEMP/app.log" 2>&1 &
          sleep 20
          tasklist //FI "IMAGENAME eq snyvi-app.exe" | grep -q snyvi-app.exe || {
            echo "no native window is running:"; cat "$RUNNER_TEMP/app.log"; exit 1; }
          taskkill //F //IM snyvi-app.exe
          ./target/release/snyvi.exe stop
      - name: Package
        shell: pwsh
        run: |
          $version = $env:VERSION
          $name = "snyvi-$version-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item target/release/snyvi.exe, target/release/snyvi-app.exe, README.md "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          # Written as sha256sum writes it -- two spaces, a bare filename, a
          # single newline -- so `sha256sum -c` reads this one like the others.
          $file = "dist/$name.zip"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText((Join-Path (Resolve-Path "dist") "$name.zip.sha256"), "$hash  $name.zip`n")
          # The installer, which is what the README gives a Windows reader;
          # the zip stays for anyone who would rather have a folder.
          pwsh packaging/windows.ps1 $version
          if ($LASTEXITCODE -ne 0) { throw "the installer did not build" }
      - name: The same downloads, under names that do not move
        # See the Linux job: the README links at an exact asset name, so the
        # installer needs one that outlives this version. The zip gets one
        # too, because it is what a daemon updates itself from: a running
        # .exe cannot be overwritten on Windows but can be renamed, and the
        # zip's two files are what go in beside the renamed ones.
        shell: pwsh
        run: |
          $v = $env:VERSION
          foreach ($pair in @(
              @("snyvi-$v-x86_64-pc-windows-msvc-setup.exe", "snyvi-windows-x64-setup.exe"),
              @("snyvi-$v-x86_64-pc-windows-msvc.zip",       "snyvi-windows-x64.zip"))) {
            $from, $alias = $pair
            Copy-Item "dist/$from" "dist/$alias"
            $hash = (Get-FileHash "dist/$alias" -Algorithm SHA256).Hash.ToLower()
            [IO.File]::WriteAllText((Join-Path (Resolve-Path "dist") "$alias.sha256"), "$hash  $alias`n")
          }
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.zip
            dist/*-setup.exe
      - name: Onto the draft
        shell: bash
        run: gh release upload "v$VERSION" dist/*.zip dist/*-setup.exe dist/*.sha256 --clobber

  macos:
    # One bundle per architecture, and the bundle is the whole download: both
    # executables are inside snyvi.app, the window is what a double-click
    # runs, and the command line is a symlink to the snyvi beside it. There
    # is no static/dynamic fork here either -- the window uses the WebKit
    # that is part of macOS -- so, as on Windows, nothing is a second step.
    needs: create
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-apple-darwin
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.create.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        # Two passes, the same shape as Windows: snyvi is never built with the
        # desktop feature, so tauri's build script cannot follow it into a
        # binary that never opens a window.
        run: |
          cargo build --release --bin snyvi
          cargo build --release --bin snyvi-app --features desktop
      - name: Smoke test the daemon
        run: |
          set -e
          file target/release/snyvi target/release/snyvi-app
          export SNYVI_DATA_DIR="$RUNNER_TEMP/s" SNYVI_CONFIG_DIR="$RUNNER_TEMP/c" SNYVI_PORT=7805
          ./target/release/snyvi send README.md
          # SNYVI_BENCH_SHARED as on the Windows runner: how fast this VM
          # creates a process is the runner's to answer, not snyvi's. The
          # rows that are not clocks are enforced.
          SNYVI_BENCH_SHARED=1 SNYVI_BENCH_FACTOR=3 ./target/release/snyvi bench --check
          ./target/release/snyvi stop
      - name: Package
        run: |
          name=snyvi-$VERSION-${{ matrix.target }}
          mkdir -p dist/$name
          packaging/app.sh target/release/snyvi target/release/snyvi-app "$VERSION" dist/$name
          cp README.md dist/$name/
          plutil -lint dist/$name/snyvi.app/Contents/Info.plist
          codesign --verify --deep --strict dist/$name/snyvi.app
          test -f dist/$name/snyvi.app/Contents/Resources/snyvi.icns
          tar -C dist -czf dist/$name.tar.gz $name
          (cd dist && shasum -a 256 $name.tar.gz > $name.tar.gz.sha256)
      - name: Open a window from the bundle
        # From the copy about to be shipped, and with no URL: that is what a
        # double-click does, and it must start the daemon and come back with
        # one. The window then holds the foreground; a browser fallback would
        # have returned at once.
        run: |
          set -e
          export SNYVI_DATA_DIR="$RUNNER_TEMP/s2" SNYVI_CONFIG_DIR="$RUNNER_TEMP/c2" SNYVI_PORT=7806
          app=dist/snyvi-$VERSION-${{ matrix.target }}/snyvi.app
          "$app/Contents/MacOS/snyvi-app" > "$RUNNER_TEMP/app.log" 2>&1 &
          sleep 20
          curl -sf http://127.0.0.1:7806/api/health
          pgrep -x snyvi-app >/dev/null || { echo "no native window is running:"; cat "$RUNNER_TEMP/app.log"; exit 1; }
          grep -q "no native window" "$RUNNER_TEMP/app.log" && { echo "fell back to a browser"; exit 1; } || true
          cat "$RUNNER_TEMP/app.log"
          pkill -x snyvi-app || true
          "$app/Contents/MacOS/snyvi" stop
      - name: The same download, under a name that does not move
        # See the Linux job. The cask keeps reading the version-stamped names.
        run: |
          case "${{ matrix.target }}" in aarch64-*) arch=arm64;; *) arch=x64;; esac
          cp "dist/snyvi-$VERSION-${{ matrix.target }}.tar.gz" "dist/snyvi-macos-$arch.tar.gz"
          (cd dist && shasum -a 256 "snyvi-macos-$arch.tar.gz" > "snyvi-macos-$arch.tar.gz.sha256")
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz
      - name: Onto the draft
        run: gh release upload "v$VERSION" dist/*.tar.gz dist/*.sha256 --clobber

  publish:
    # The gate. Nothing below it runs, and nothing above it is visible, until
    # every download is on the draft and the manifest that names them is
    # written and signed. latest.json is what a running snyvi reads to learn
    # what is out (packaging/manifest.py says what is in it); its signature
    # is what lets the daemon take it at all, so a release without the
    # signing key stops here, a draft, rather than publish a manifest that
    # every daemon would refuse.
    needs: [create, build, desktop, windows, macos]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.create.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Every download is on the draft
        run: |
          gh release view "v$VERSION" --json assets -q '.assets[].name' | sort > "$RUNNER_TEMP/have"
          missing=0
          for name in $(packaging/manifest.py --names); do
            for f in "$name" "$name.sha256"; do
              grep -qx "$f" "$RUNNER_TEMP/have" || { echo "missing from the draft: $f"; missing=1; }
            done
          done
          test "$missing" = 0 || exit 1
          echo "$(wc -l < "$RUNNER_TEMP/have") files on the draft, every one the manifest names among them"
      - name: Write latest.json
        # hotfix_below comes from the dispatch input, or from a `hotfix:
        # <version>` line in the tag's message; it is never derived, because
        # it is the one field that moves every machine within hours rather
        # than once a day. Failing both, the previous release's is carried
        # forward (manifest.py --prev), so an ordinary release the day after
        # a hotfix does not take the hurry away from machines still behind.
        #
        # The tag is fetched by hand first: actions/checkout leaves a tag
        # that points at the commit, not at the annotated tag object, and
        # `%(contents)` of that is the commit's message -- so a hotfix line
        # was never read. A lightweight tag, or a dispatch with no tag yet,
        # has no message of its own, and means no hotfix line.
        run: |
          hotfix="${{ github.event.inputs.hotfix_below }}"
          if [ -z "$hotfix" ] && git fetch --force origin "+refs/tags/v$VERSION:refs/tags/v$VERSION" 2>/dev/null; then
            if [ "$(git cat-file -t "v$VERSION")" = tag ]; then
              hotfix=$(git tag -l --format='%(contents)' "v$VERSION" | sed -n 's/^hotfix: *//p' | head -1)
            else
              echo "v$VERSION is a lightweight tag: no message, so no hotfix line"
            fi
          fi
          test -z "$hotfix" || echo "hotfix_below: $hotfix"
          # The manifest the current latest release published, before this
          # one takes its place. None on the first release.
          gh release download -p latest.json -O "$RUNNER_TEMP/prev.json" 2>/dev/null \
            || echo "no previous latest.json; nothing to carry"
          gh release download "v$VERSION" -p '*.sha256' -D "$RUNNER_TEMP/sums"
          packaging/manifest.py "$VERSION" "$RUNNER_TEMP/sums" --out dist/latest.json \
            --hotfix-below "$hotfix" --prev "$RUNNER_TEMP/prev.json"
      - name: Sign it
        # minisign over the manifest, with the public key compiled into snyvi;
        # sha256 in the manifest catches a corrupt download, the signature
        # catches a manifest that did not come from this job. The key pair is
        # made once, without a password so this step has no prompt to answer:
        #
        #   minisign -G -W -p packaging/minisign.pub -s minisign.key
        #   gh secret set MINISIGN_SECRET_KEY < minisign.key
        #
        # and the public half is committed. Signed, then checked against that
        # committed key, so a secret that does not match the key the daemon
        # trusts fails here and not on every machine at once.
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        #
        # Without the key there is no release: a daemon refuses an unsigned
        # latest.json outright, so publishing one would stall every machine
        # on the version it has, silently. A dry run publishes nothing, so
        # there it is only a warning.
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "::warning::MINISIGN_SECRET_KEY is not set; this dry run's latest.json is unsigned, and a real run would stop here."
              exit 0
            fi
            echo "::error::MINISIGN_SECRET_KEY is not set; latest.json cannot be signed, and no daemon takes an unsigned one. Set the secret, then re-run this job."
            exit 1
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          (umask 077; printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign.key")
          minisign -S -W -s "$RUNNER_TEMP/minisign.key" -m dist/latest.json -t "snyvi $VERSION"
          rm -f "$RUNNER_TEMP/minisign.key"
          test -f packaging/minisign.pub || { echo "packaging/minisign.pub is not committed; the daemon has no key to check against"; exit 1; }
          minisign -V -p packaging/minisign.pub -m dist/latest.json
      - name: The manifest, in the log
        run: |
          cat dist/latest.json
          ls -l dist
      - name: Onto the draft
        run: gh release upload "v$VERSION" dist/latest.json* --clobber
      - name: Publish
        # The one moment the release becomes visible: every download, the
        # manifest and its signature are already on it. --latest so that
        # /releases/latest/download/ points here from now on, which is the
        # URL every README link and every daemon reads -- but only when this
        # version is newer than the latest. A backport cut below it must not
        # take that URL: every daemon would read an older manifest, and one
        # that had applied the newer version would clean up its .prev for a
        # release it had already passed.
        if: ${{ !inputs.dry_run }}
        run: |
          # Equal is a re-run of this step after the flip, and stays latest.
          current=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
          current=${current#v}
          if [ -z "$current" ] || [ "$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -1)" = "$VERSION" ]; then
            gh release edit "v$VERSION" --draft=false --latest
          else
            echo "::notice::v$VERSION is not newer than the latest ($current); published without taking /releases/latest"
            gh release edit "v$VERSION" --draft=false --latest=false
          fi
      - name: Dry run
        if: ${{ inputs.dry_run }}
        run: |
          echo "::notice::dry run: v$VERSION stays a draft at $(gh release view "v$VERSION" --json url -q .url); delete it by hand, or let the next real run of $VERSION reuse it."

  crate:
    # `cargo install snyvi`. After `publish`, so a crate never names a version
    # whose downloads are not public yet. Default features only: `snyvi-app`
    # is behind `desktop`, so what a crates.io user compiles is the static
    # daemon and CLI and never WebKitGTK.
    #
    # Skipped, not failed, without the token: a fork, or a release cut before
    # the secret was set, still ships every download above.
    needs: publish
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::warning::CARGO_REGISTRY_TOKEN is not set; the crate was not published."
            exit 0
          fi
          # The crate is capped at 10 MB and the checkout is 80: the exclude
          # list in Cargo.toml is what keeps it at 2. Say the size in the log.
          cargo package --no-verify 2>&1 | tail -1
          cargo publish

  scoop:
    # `scoop bucket add snyvi https://github.com/snymrova/scoop-snyvi` and
    # `scoop install snyvi`. The manifest is written from the .sha256 the
    # windows job uploaded beside the zip (packaging/scoop.sh) and pushed to
    # the bucket, so the bucket cannot fall behind a release either. After
    # `publish`, because the script reads that .sha256 from the public
    # download URL, which a draft does not have.
    #
    # The bucket is its own repository, as the Homebrew tap is, because
    # `scoop bucket add` clones the whole repository it is given and this one
    # is 80 MB of film. A token with contents:write on snymrova/scoop-snyvi:
    # SCOOP_BUCKET_TOKEN, or the tap's token if that one already reaches the
    # bucket. Skipped without either.
    needs: [create, publish]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write the manifest and push it to the bucket
        env:
          BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN || secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.create.outputs.version }}
        run: |
          if [ -z "$BUCKET_TOKEN" ]; then
            echo "::warning::SCOOP_BUCKET_TOKEN is not set; the bucket was not updated."
            exit 0
          fi
          manifest=$(packaging/scoop.sh "$VERSION" dist)
          python3 -m json.tool "$manifest" > /dev/null
          git clone --depth 1 "https://x-access-token:${BUCKET_TOKEN}@github.com/snymrova/scoop-snyvi.git" bucket
          mkdir -p bucket/bucket
          cp "$manifest" bucket/bucket/snyvi.json
          cd bucket
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add bucket/snyvi.json
          git diff --cached --quiet && { echo "the bucket already says $VERSION"; exit 0; }
          git commit -m "snyvi $VERSION"
          git push

  homebrew:
    # `brew install --cask snymrova/snyvi/snyvi`. The cask is written from the
    # .sha256 files the macos job uploaded (packaging/homebrew.sh), and
    # pushed to the tap, so the tap cannot fall behind a release: the version
    # in it is bumped by the same run that published the version. After
    # `publish` for the same reason as scoop: the script reads the public
    # download URL.
    #
    # GITHUB_TOKEN cannot write to another repository, so this needs a token
    # with contents:write on snymrova/homebrew-snyvi. Skipped without one.
    needs: [create, publish]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write the cask and push it to the tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.create.outputs.version }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set; the tap was not updated."
            exit 0
          fi
          cask=$(packaging/homebrew.sh "$VERSION" dist)
          ruby -c "$cask"
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/snymrova/homebrew-snyvi.git" tap
          mkdir -p tap/Casks
          cp "$cask" tap/Casks/snyvi.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add Casks/snyvi.rb
          git diff --cached --quiet && { echo "the tap already says $VERSION"; exit 0; }
          git commit -m "snyvi $VERSION"
          git push
