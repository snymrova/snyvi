name: ci
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  build-test-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --release -- -D warnings
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - name: Package and install the .deb
        # The packaging script only runs at release time otherwise, which is the
        # one moment it must not be broken.
        run: |
          set -e
          sudo apt-get install -y -qq desktop-file-utils
          deb=$(packaging/deb.sh target/release/snyvi 0.0.0-ci amd64 /tmp/deb)
          dpkg-deb -c "$deb"
          sudo dpkg -i "$deb"
          test "$(command -v snyvi)" = /usr/bin/snyvi
          snyvi --version
          desktop-file-validate /usr/share/applications/snyvi.desktop
          systemd-analyze verify /usr/lib/systemd/user/snyvi.service
          sudo dpkg -r snyvi
      - name: Perf budget
        # Hosted runners are slower and noisier than a dev box; scale the budgets, but a
        # regression that triples a case still fails the build.
        run: SNYVI_BENCH_FACTOR=3 ./target/release/snyvi bench --check
      - name: Smoke test the daemon
        run: |
          set -e
          export SNYVI_DATA_DIR=/tmp/snyvi-ci SNYVI_CONFIG_DIR=/tmp/snyvi-ci-cfg SNYVI_PORT=7791
          url=$(./target/release/snyvi send README.md)
          echo "$url"
          curl -sf "$url" > /dev/null
          curl -sf http://127.0.0.1:7791/api/health
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:7791/api/docs -H 'content-type: application/json' -d '{"content":"x"}')" = "401"
      - name: Smoke test watch
        # A save while `snyvi watch` runs must reach the daemon as the same document.
        run: |
          set -e
          export SNYVI_DATA_DIR=/tmp/snyvi-ci SNYVI_CONFIG_DIR=/tmp/snyvi-ci-cfg SNYVI_PORT=7791
          printf '# Watched\n\nfirst draft\n' > /tmp/watched.md
          timeout 8 ./target/release/snyvi watch /tmp/watched.md > /tmp/watch.out 2> /tmp/watch.err &
          sleep 2
          printf '# Watched\n\nsecond draft\n' > /tmp/watched.md
          wait %1 || true
          cat /tmp/watch.err
          url=$(head -1 /tmp/watch.out)
          curl -sf "$url" | grep -q "second draft"
          grep -q "watched.md → $url" /tmp/watch.err
          ./target/release/snyvi stop

  desktop:
    # The Tauri window is behind a feature flag, so nothing else compiles it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop
      - name: WebKitGTK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev xvfb
      - name: Build
        run: cargo build --release --features desktop
      - name: Open a window
        # 124 is the timeout firing, which means the window stayed up.
        run: |
          set -e
          export SNYVI_DATA_DIR=/tmp/s-desktop SNYVI_CONFIG_DIR=/tmp/c-desktop SNYVI_PORT=7812
          xvfb-run -a -s "-screen 0 1280x860x24" timeout 20 ./target/release/snyvi app > /tmp/app.log 2>&1 || code=$?
          test "${code:-0}" = "124" || { echo "window exited early:"; cat /tmp/app.log; exit 1; }
          ./target/release/snyvi stop
