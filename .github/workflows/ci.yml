name: ci
# A branch is tested through its pull request and main through its pushes.
# Both on every push, as before, ran the whole matrix twice for one commit;
# and a merge that only lands a pull request's tested tree runs the one job
# the pull request skipped (see the gate).
# workflow_dispatch is the full matrix on demand, for a branch that wants
# the Intel Mac before it merges: `gh workflow run ci.yml --ref <branch>`.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# A newer push to a pull request makes the run for the older one worthless.
# Not on main, where every merge keeps its own run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  gate:
    # Main's pushes are merges. When one changes nothing its pull request's
    # run did not already test -- the merge's tree is its second parent's,
    # and that commit has a green run -- the whole matrix again proves only
    # the runner's luck: 1.20.0's merge went red on a timing flake in the
    # very tree that had just passed. Then the Intel Mac runs alone, since a
    # pull request never gets it. Any other push, every pull request and
    # every dispatch run in full. Nothing in release.yml waits on main's run.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      full: ${{ steps.g.outputs.full }}
      macs: ${{ steps.g.outputs.macs }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge and both its parents, which is all the comparison needs.
          fetch-depth: 2
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          arm='{"target":"aarch64-apple-darwin","runner":"macos-14"}'
          intel='{"target":"x86_64-apple-darwin","runner":"macos-15-intel"}'
          full=true macs="[$arm,$intel]"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            macs="[$arm]"
          elif [ "$GITHUB_EVENT_NAME" = push ] && head=$(git rev-parse -q --verify HEAD^2) \
            && [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'HEAD^2^{tree}')" ]; then
            # A pull request's run is filed under its head commit, not the
            # merge ref it checks out, which is what makes this lookup work.
            green=$(gh run list --workflow ci.yml --commit "$head" --status success --json databaseId -q length || echo 0)
            if [ "${green:-0}" -gt 0 ]; then
              full=false macs="[$intel]"
              echo "this merge's tree is $head's, which passed: the Intel Mac runs, nothing else"
            fi
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "macs=$macs" >> "$GITHUB_OUTPUT"

  test:
    # What was one Linux job is three stages, so the slowest bench no longer
    # waits behind every other: this, beside the build, and then the benches
    # in four shards on the binary the build hands over.
    #
    # Without fat LTO: `cargo test --release` links every test binary with
    # the release profile, and nothing here measures them. The size budget
    # is the build job's, on the binary that ships.
    needs: gate
    if: needs.gate.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SNYVI_UPDATES: "off"
      CARGO_PROFILE_RELEASE_LTO: "off"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --release -- -D warnings
      - name: Test
        run: cargo test --release

  build:
    # The release profile, fat LTO and all: the perf budget measures this
    # binary's size, and the packaging steps run here because they need it.
    needs: gate
    if: needs.gate.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SNYVI_UPDATES: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Package and install the .deb
        # The packaging script only runs at release time otherwise, which is the
        # one moment it must not be broken.
        run: |
          set -e
          sudo apt-get install -y -qq desktop-file-utils
          deb=$(packaging/deb.sh target/release/snyvi 0.0.0-ci amd64 /tmp/deb)
          dpkg-deb -c "$deb"
          sudo dpkg -i "$deb"
          test "$(command -v snyvi)" = /usr/bin/snyvi
          snyvi --version
          desktop-file-validate /usr/share/applications/snyvi.desktop
          systemd-analyze verify /usr/lib/systemd/user/snyvi.service
          sudo dpkg -r snyvi
      - name: The crate fits, and the Homebrew cask and winget manifests can be written
        # Both run only on release day otherwise. The crate is capped at 10 MB
        # and the checkout holds 80 of film and pictures; one media file
        # committed outside the exclude list would fail `cargo publish` after
        # every binary had shipped. --no-verify because the build above is the
        # verification. The cask is written from the latest release's hashes
        # and syntax-checked, so a change to homebrew.sh fails here; the same
        # for winget.sh's three files.
        run: |
          set -e
          # Fresh: a .crate rewritten over a larger one keeps the old tail.
          rm -rf target/package
          cargo package --no-verify --allow-dirty
          size=$(stat -c %s target/package/snyvi-*.crate)
          echo "crate: $size bytes"
          test "$size" -lt 8000000 || { echo "the crate is $size bytes; crates.io takes 10 MB. Add to exclude in Cargo.toml."; exit 1; }
          latest=$(gh release view --json tagName -q .tagName)
          ruby -c "$(packaging/homebrew.sh "$latest" /tmp/cask)"
          python3 -c 'import sys, yaml; [yaml.safe_load(open(f)) for f in sys.argv[1:]]' \
            "$(packaging/winget.sh "$latest" /tmp/winget)"/*.yaml
        env:
          GH_TOKEN: ${{ github.token }}
      - name: The update manifest can be written
        # latest.json is what a running snyvi reads to learn what is out, and
        # release.yml writes it from the .sha256 files beside every download.
        # A made-up set of those proves the script, its names and the checks
        # that stop a half-built release on every push, not on release day.
        run: |
          set -e
          mkdir -p /tmp/sums
          for name in $(packaging/manifest.py --names); do
            printf '%s  %s\n' "$(printf '%s' "$name" | sha256sum | cut -d' ' -f1)" "$name" > "/tmp/sums/$name.sha256"
          done
          packaging/manifest.py 0.0.0 /tmp/sums --out /tmp/latest.json --app-min 0.0.0 --hotfix-below 0.0.0
          python3 -c "import json; m=json.load(open('/tmp/latest.json')); assert m['assets']['linux-x64']['snyvi'][0]=='snyvi-linux-x64.tar.gz' and m['hotfix_below']=='0.0.0', m"
          # hotfix_below outlives the release that set it: carried from the
          # previous manifest when none is given, overridden by one that is,
          # dropped when it is newer than this release (a backport), and
          # null with no previous manifest at all (the first release).
          hotfix() { python3 -c "import json; print(json.load(open('/tmp/latest.json'))['hotfix_below'])"; }
          printf '{"version":"1.2.0","hotfix_below":"1.2.0"}\n' > /tmp/prev.json
          packaging/manifest.py 1.3.0 /tmp/sums --out /tmp/latest.json --app-min 0.0.0 --prev /tmp/prev.json 2>/dev/null
          test "$(hotfix)" = 1.2.0 || { echo "hotfix_below was not carried: $(hotfix)"; exit 1; }
          packaging/manifest.py 1.3.0 /tmp/sums --out /tmp/latest.json --app-min 0.0.0 --prev /tmp/prev.json --hotfix-below 1.1.0 2>/dev/null
          test "$(hotfix)" = 1.1.0 || { echo "an explicit hotfix_below lost to the carried one: $(hotfix)"; exit 1; }
          packaging/manifest.py 1.1.5 /tmp/sums --out /tmp/latest.json --app-min 0.0.0 --prev /tmp/prev.json 2>/dev/null
          test "$(hotfix)" = None || { echo "a backport carried a hotfix_below above itself: $(hotfix)"; exit 1; }
          packaging/manifest.py 1.3.0 /tmp/sums --out /tmp/latest.json --app-min 0.0.0 --prev /tmp/no-such.json 2>/dev/null
          test "$(hotfix)" = None || { echo "no previous manifest, yet hotfix_below is $(hotfix)"; exit 1; }
          # A release that has not got every download is not described.
          rm /tmp/sums/snyvi-windows-x64.zip.sha256
          packaging/manifest.py 0.0.0 /tmp/sums --out /tmp/latest.json --app-min 0.0.0 2>/dev/null && { echo "manifest.py wrote a manifest with a download missing"; exit 1; }
          # And app_min in Cargo.toml is a version the release could carry.
          python3 -c "import tomllib; d=tomllib.load(open('Cargo.toml','rb')); v=d['package']['version']; m=d['package']['metadata']['snyvi']['app_min']; assert tuple(map(int,m.split('.')))<=tuple(map(int,v.split('.'))), f'app_min {m} is newer than {v}'"
      - name: Lay out the .app
        # The other packaging script, which only a Mac can finish (the icon
        # and the signature) but any machine can lay out. Run here so that an
        # error in the script is found on every push and not on release day;
        # the macos job below does the whole thing.
        run: |
          set -e
          app=$(packaging/app.sh target/release/snyvi target/release/snyvi 0.0.0-ci /tmp/app 2>/dev/null)
          test -x "$app/Contents/MacOS/snyvi-app"
          test -x "$app/Contents/MacOS/snyvi"
          python3 -c "import plistlib,sys; d=plistlib.load(open(sys.argv[1],'rb')); assert d['CFBundleExecutable']=='snyvi-app' and d['CFBundleShortVersionString']=='0.0.0-ci', d" "$app/Contents/Info.plist"
      - uses: actions/upload-artifact@v4
        with:
          name: snyvi-linux
          path: target/release/snyvi
          retention-days: 1

  bench:
    # Every bench copies the binary out of target/, where it would count as
    # a per-user install and read GitHub for a newer version mid-run. The
    # benches are offline; bench/update.mjs clears this for its own daemon.
    #
    # Four shards of about the same length, each on a runner of its own, so
    # a red row in one no longer skips every step after it. bench/ui.mjs is
    # cut in two at a section; each half starts a daemon of its own.
    needs: build
    strategy:
      fail-fast: false
      matrix:
        shard: [page-1, page-2, daemon, budgets]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SNYVI_UPDATES: "off"
      UI_CUT: a folder, opened in snyvi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: snyvi-linux
          path: target/release
      - run: chmod +x target/release/snyvi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Perf budget
        if: matrix.shard == 'budgets'
        # Hosted runners are slower and noisier than a dev box; scale the budgets, but a
        # regression that triples a case still fails the build. Only the clocks scale:
        # the binary's size and the daemon's resident set are the same on any machine,
        # and the bench measures both on a daemon it starts for itself.
        run: SNYVI_BENCH_FACTOR=3 ./target/release/snyvi bench --check
      # Node 22 for the global WebSocket the harness drives Chromium with; the
      # runner's own Node may be older, and nothing else here uses it.
      - name: Browser budget
        if: matrix.shard == 'budgets'
        # `snyvi bench` measures the daemon. This measures the half the reader
        # actually waits on, which is where the seconds were: a 220-node diagram
        # froze the tab for 3.1 s before the scheduler landed.
        #
        # SNYVI_BENCH_SHARED because a hosted runner's speed is not snyvi's to
        # promise: two of them reported 444 ms and 1404 ms of first paint for
        # the same commit. Those rows are printed and not enforced here. What is
        # enforced is the behaviour -- a diagram below the fold is not drawn, one
        # over the cap is offered rather than spent, find marks nothing inside an
        # SVG, leaving a document mid-render strands nothing -- none of which
        # depends on the clock, plus the one timing that does not either:
        # whether drawing is cut into slices. See docs/DIAGRAMS.md.
        run: SNYVI_BENCH_SHARED=1 SNYVI_BENCH_FACTOR=3 node bench/browser.mjs --check
      - name: Opening a document
        if: matrix.shard == 'budgets'
        # The gesture a reader makes most, which none of the benches above
        # measured: a click on a row, and a document on screen. The clocks
        # are printed and not enforced here, for the same reason as the row
        # above; what is enforced is what an open costs to hold and in what
        # order it happens -- the layout tree of a 6,000-line file against
        # the same page with containment off, the bytes the daemon serves
        # per line, the heap either side of twenty opens, and that no row is
        # rebuilt before the reader sees the page. None of that depends on
        # the clock. See the top of bench/open.mjs.
        run: SNYVI_BENCH_SHARED=1 SNYVI_BENCH_FACTOR=3 node bench/open.mjs --check
      - name: What the page does, to the cut
        if: matrix.shard == 'page-1'
        # Not how fast, what: where the contents' marker is, what a wheel
        # moves, what Back does, what `t` opens at 1000 px, whether Tab
        # reaches every control. Counts and positions, so every row holds on
        # any machine. See the 0.11 and 0.12 notes in docs/ROADMAP.md.
        run: node bench/ui.mjs --check --before "$UI_CUT"
      - name: What the page does, from the cut
        if: matrix.shard == 'page-2'
        run: node bench/ui.mjs --check --from "$UI_CUT"
      - name: A restart that costs nothing
        if: matrix.shard == 'daemon'
        # A daemon of its own on a spare port: a panel with an agent mid-turn
        # holds `snyvi restart` back; the turn ending lets it go; the new
        # daemon says which panel comes back as a conversation, and the page
        # asks for exactly that. Never the daemon on 7777.
        run: node bench/restart.mjs
      - name: The daemon updates itself
        if: matrix.shard == 'daemon'
        # A release of its own: a manifest signed with a key made for the
        # run, served from a port beside a daemon on another, a tarball of
        # the binary just built. The daemon checks, stages, verifies, applies
        # at a quiet moment, comes back on the new file with the old beside
        # it, holds the next one behind the daily floor, lets a hotfix
        # through, rolls back a build that will not start, and goes back on
        # request. Never the daemon on 7777, never GitHub.
        run: node bench/update.mjs
      - name: What a hook costs the turn
        if: matrix.shard == 'daemon'
        # A daemon of its own on a spare port, and Claude Code's events fed
        # to `snyvi hook` under strace: one connection and no thread per
        # prompt, no snyvi at all for another server's tool, and with no
        # daemon a Markdown save returns inside 1.6 s and starts nothing.
        # Counts, so they hold on any runner. See the top of bench/hook.mjs.
        run: |
          command -v strace >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq strace; }
          node bench/hook.mjs --check
      - name: What a save costs the search index
        if: matrix.shard == 'daemon'
        # Five hundred plans in and saved again through a daemon of its own,
        # then the database read with the sqlite3 shell: every index row on
        # its document's rowid, and the delete a save runs under 64 KB of
        # pages. See the top of bench/store.mjs.
        run: |
          command -v sqlite3 >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq sqlite3; }
          node bench/store.mjs --check
      - name: What the page weighs
        if: matrix.shard == 'budgets'
        # The four assets the page cannot start without, fetched from a
        # daemon this starts and gzipped as it serves them -- not read out of
        # ui/, which stopped being the same bytes when build.rs began taking
        # the comments out. Two things fail a push: first paint over the
        # budget bench/bytes.mjs states (56 KB today), and an asset that does not
        # parse as served, which is the strip's own safety net.
        run: node bench/bytes.mjs --check
      - name: The design system's debt only goes down
        if: matrix.shard == 'budgets'
        # docs/DESIGN.md §9.3: raw colours, off-scale font sizes, raw
        # durations, unnamed z-indexes, titles, raw errors, banned words,
        # buttons nested in links -- each counted against
        # bench/lint-ui.baseline.json. Report mode: the push fails only when
        # a count goes up, and a change that pays debt lowers the file.
        run: node bench/lint-ui.mjs --check
      - name: Nothing over a size ceiling grew
        if: matrix.shard == 'budgets'
        # CLAUDE.md: a file over 2,500 lines or a function over 120 may only
        # shrink, held against bench/size.baseline.json. A change that
        # splits a module lowers the file in the same commit.
        run: node bench/size.mjs --check
      - name: The README's pictures can still be taken
        if: matrix.shard == 'budgets'
        # bench/media.mjs is the camera the README's pictures come from; a
        # release re-takes them. Taken here into a folder that is thrown
        # away, so a view it points at that has moved fails the push and
        # not the release.
        run: node bench/media.mjs --out /tmp/snyvi-media
      - name: The film's frames can still be taken
        if: matrix.shard == 'budgets'
        # film/capture.mjs is the camera the demo is cut from, and it points
        # at views of its own -- the arrival bar, the diff, the palette. Taken
        # here into a folder that is thrown away, for the same reason as the
        # pictures above: a view that has moved should fail the push. Cutting
        # the film itself is a release-day job, and lives in film/README.md.
        #
        # The camera asks Blink for the raster scale it wants rather than
        # shelling out to scale the file afterwards, so this step needs no
        # ffmpeg -- which the runner does not have, and which is why the
        # first version of this step failed the build. The rest of the film's
        # pipeline does need it, and stays a release-day job.
        run: node film/capture.mjs --out /tmp/snyvi-film
      - name: Smoke test the daemon
        if: matrix.shard == 'daemon'
        run: |
          set -e
          export SNYVI_DATA_DIR=/tmp/snyvi-ci SNYVI_CONFIG_DIR=/tmp/snyvi-ci-cfg SNYVI_PORT=7791
          url=$(./target/release/snyvi send README.md)
          echo "$url"
          curl -sf "$url" > /dev/null
          curl -sf http://127.0.0.1:7791/api/health
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:7791/api/docs -H 'content-type: application/json' -d '{"content":"x"}')" = "401"
      - name: The first ten minutes
        if: matrix.shard == 'daemon'
        # What a newcomer types, in a home that has never seen snyvi, against
        # a claude that keeps user-scope servers where the real one does:
        # init-claude twice, the binary moving onto PATH, status, --claude-md,
        # uninstall-claude leaving the settings file as it was found, no
        # claude at all, a taken port, no browser, install-cli. See
        # bench/onboarding.sh and the 0.17 notes in docs/ROADMAP.md.
        run: HOMEDIR=/tmp/snyvi-first B=target/release/snyvi bash bench/onboarding.sh
      - name: Nothing opens a terminal any more
        if: matrix.shard == 'daemon'
        # 1.16 took Open terminal here away: a desk is the terminal. The route
        # that started one is gone, not merely refused, and a foreign page is
        # still turned away at the Origin before it learns even that.
        # See docs/TERMINAL.md §10.
        run: |
          set -e
          export SNYVI_DATA_DIR=/tmp/snyvi-ci SNYVI_CONFIG_DIR=/tmp/snyvi-ci-cfg SNYVI_PORT=7791
          docid=$(./target/release/snyvi send README.md | tail -1); docid=${docid##*/}
          post() { curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'content-type: application/json' "$@" \
            -d "{\"doc\":\"$docid\"}" http://127.0.0.1:7791/api/terminal; }
          test "$(post -H 'Origin: https://evil.example')" = "403"
          test "$(post -H 'Origin: http://127.0.0.1:7791' -H 'Sec-Fetch-Site: cross-site')" = "403"
          # The page's own Origin reaches the router, which has no such route.
          test "$(post -H 'Origin: http://127.0.0.1:7791')" = "404"
          # On the process name and not the command line: `pgrep -f` matches the
          # pattern where it appears in this script's own arguments, which is a
          # green check that would have gone red for the wrong reason.
          ! ps -e -o comm= | grep -qxE 'gnome-terminal|konsole|xfce4-terminal|alacritty|kitty|foot|ptyxis|wezterm|x-terminal-emulator'
      - name: Smoke test watch
        if: matrix.shard == 'daemon'
        # A save while `snyvi watch` runs must reach the daemon as the same document.
        run: |
          set -e
          export SNYVI_DATA_DIR=/tmp/snyvi-ci SNYVI_CONFIG_DIR=/tmp/snyvi-ci-cfg SNYVI_PORT=7791
          printf '# Watched\n\nfirst draft\n' > /tmp/watched.md
          timeout 8 ./target/release/snyvi watch /tmp/watched.md > /tmp/watch.out 2> /tmp/watch.err &
          sleep 2
          printf '# Watched\n\nsecond draft\n' > /tmp/watched.md
          wait %1 || true
          cat /tmp/watch.err
          url=$(head -1 /tmp/watch.out)
          curl -sf "$url" | grep -q "second draft"
          grep -q "watched.md → $url" /tmp/watch.err
          ./target/release/snyvi stop

  relay:
    # The relay two snyvis meet through (relay/): wrangler dev on a spare
    # port, workerd local, every route driven as the daemon drives it. Never
    # a deploy, which is `npm run deploy` by hand with the account's token.
    needs: gate
    if: needs.gate.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
        env:
          CI: "1"
          WRANGLER_SEND_METRICS: "false"

  installer:
    # The one-liner, run for real, in three distributions: the per-user
    # install every Linux gets by default, an update over a running daemon,
    # uninstall-desktop, and on the Debian family a .deb that stays a .deb
    # until --tar moves it. In containers, under a throwaway HOME, with the
    # downloads built from this commit and handed over by SNYVI_ASSET_DIR;
    # never GitHub, never a daemon anyone uses. See bench/install.sh.
    #
    # The static build a release ships, since the containers are older than
    # the runner and a binary linked against its glibc would not start in
    # them. With the release profile, fat LTO and all, and the release's own
    # smoke test on it: 1.20.0's tag failed there on the static binary's
    # size, 18.0 MB against 18, which the glibc build the bench job measures
    # (17.3) never showed. This job is off the critical path, so the longer
    # link costs no one a wait.
    needs: gate
    if: needs.gate.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: installer-musl
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - name: A static build
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --target x86_64-unknown-linux-musl --bin snyvi
      - name: The static binary keeps its budgets
        # release.yml's smoke test, as it runs there.
        env:
          SNYVI_UPDATES: "off"
        run: |
          B=target/x86_64-unknown-linux-musl/release/snyvi
          file $B
          SNYVI_DATA_DIR=/tmp/s SNYVI_CONFIG_DIR=/tmp/c SNYVI_PORT=7802 $B send README.md
          SNYVI_BENCH_FACTOR=3 $B bench --check
          SNYVI_DATA_DIR=/tmp/s SNYVI_CONFIG_DIR=/tmp/c SNYVI_PORT=7802 $B stop
      - name: The downloads, named as a release names them
        run: |
          set -e
          B=target/x86_64-unknown-linux-musl/release/snyvi
          name=snyvi-0.0.0-ci-x86_64-unknown-linux-musl
          mkdir -p /tmp/assets/$name
          cp "$B" README.md /tmp/assets/$name/
          tar -C /tmp/assets -czf /tmp/assets/snyvi-linux-x64.tar.gz $name
          rm -r /tmp/assets/$name
          deb=$(packaging/deb.sh "$B" 0.0.0-ci amd64 /tmp/deb)
          cp "$deb" /tmp/assets/snyvi-linux-x64.deb
          cd /tmp/assets && for f in *.tar.gz *.deb; do sha256sum "$f" > "$f.sha256"; done
          ls -l /tmp/assets
      - name: install.sh in Debian, Ubuntu and Fedora
        run: |
          set -e
          sh -n install.sh
          failed=0
          for image in debian:bookworm ubuntu:22.04 fedora:latest; do
            # Fedora's image has no tar; everything else the script uses is
            # in each base image, which is the point of running it there.
            prep=true
            case $image in fedora:*) prep="dnf install -y -q tar gzip >/dev/null" ;; esac
            docker run --rm -v "$PWD:/src:ro" -v /tmp/assets:/assets:ro "$image" \
              sh -c "$prep && sh /src/bench/install.sh" || failed=1
          done
          exit $failed

  desktop:
    # The Tauri window is behind a feature flag, so nothing else compiles it.
    #
    # Built on the oldest release it supports rather than ubuntu-latest: the
    # window links against the distribution's webkit, so the glibc baseline
    # dpkg-shlibdeps records is whatever the build host had. 22.04 records
    # libc6 (>= 2.34), which installs on Ubuntu 22.04 and later and on Debian
    # 12 and later; building on 24.04 would record 2.39 and silently exclude
    # both. On both architectures since 0.16, each on its own 22.04 host.
    needs: gate
    if: needs.gate.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            deb_arch: amd64
          - runner: ubuntu-22.04-arm
            deb_arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    # Nothing built here ships, so not with fat LTO, which is most of a
    # build's time; release.yml builds the downloads with the real profile.
    env:
      CARGO_PROFILE_RELEASE_LTO: "off"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # The host is part of the key, not just "desktop": this job links
          # against the host's webkit and gtk, so artifacts built on another
          # release or architecture are not interchangeable. Sharing one key
          # across them restored 24.04 dependencies here and cargo then
          # skipped rebuilding tauri whose rlib was not in them.
          key: desktop-${{ matrix.runner }}
      - name: WebKitGTK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev xvfb \
                                      dpkg-dev desktop-file-utils dbus-x11 \
                                      libayatana-appindicator3-dev x11-utils xdotool openbox
      - name: Build
        # Both: the window executable needs the feature, and snyvi itself must
        # still build here to be the thing the window is installed beside.
        run: cargo build --release --features desktop
      - name: snyvi must not link a browser engine
        # The whole point of the split. If snyvi ever gains a webkit NEEDED
        # entry again, the daemon is carrying an engine it never opens.
        run: |
          set -e
          ldd target/release/snyvi | grep -q webkit && { echo "snyvi links webkit"; ldd target/release/snyvi; exit 1; } || true
          ldd target/release/snyvi-app | grep -q webkit || { echo "snyvi-app does not link webkit"; exit 1; }
          echo "snyvi: no engine; snyvi-app: engine. as intended"
      - name: Open a window
        # 124 is the timeout firing, which means the window stayed up.
        run: |
          set -e
          export SNYVI_DATA_DIR=/tmp/s-desktop SNYVI_CONFIG_DIR=/tmp/c-desktop SNYVI_PORT=7812
          # dbus-run-session, because the tray registers on the session bus and
          # a tray that fails to build fails setup, which exits 1 rather than
          # timing out. So 124 here now also means the tray came up.
          xvfb-run -a -s "-screen 0 1280x860x24" dbus-run-session -- \
            timeout 20 ./target/release/snyvi app > /tmp/app.log 2>&1 || code=$?
          test "${code:-0}" = "124" || { echo "window exited early:"; cat /tmp/app.log; exit 1; }
          # It must have been the native window, not a browser fallback: `snyvi
          # app` execs the sibling, so the surviving process is snyvi-app.
          grep -q "no native window" /tmp/app.log && { echo "fell back to a browser"; exit 1; } || true
          # The global shortcut, since 0.16. Xvfb is an X11 display, which is
          # the one kind the hotkey interface serves on Linux, so here it must
          # register; the line is what says it did.
          grep -q "shows or hides the window from anywhere" /tmp/app.log || {
            echo "the window registered no global shortcut:"; cat /tmp/app.log; exit 1; }
          ./target/release/snyvi stop
      - name: The shortcut reaches the window
        # Registered is not the same as delivered. Under a window manager --
        # openbox, because a bare Xvfb has none, and without one the focus
        # the toggle reads is nobody's: on one runner the second press hid
        # the window, on another none of three did, and giving the focus by
        # hand changed which -- press the key and watch the main window's map
        # state. The window in front is hidden, and the next press brings it
        # back: both halves, in that order, somewhere in four presses, or the
        # key is not doing what the line above claims. The whole sequence is
        # printed either way.
        run: |
          set -e
          export SNYVI_DATA_DIR=/tmp/s-key SNYVI_CONFIG_DIR=/tmp/c-key SNYVI_PORT=7815
          cat > /tmp/press.sh <<'INNER'
          set -e
          openbox > /dev/null 2>&1 &
          # The window must map under a running manager, or nobody holds the
          # focus the toggle reads: on the arm runner a one-second sleep was
          # once not enough. Wait for the manager to announce itself.
          for _ in $(seq 1 40); do xprop -root _NET_SUPPORTING_WM_CHECK 2>/dev/null | grep -q "window id" && break; sleep 0.25; done
          xprop -root _NET_SUPPORTING_WM_CHECK | grep -q "window id" || { echo "openbox never came up"; exit 1; }
          ./target/release/snyvi app > /tmp/key-app.log 2>&1 &
          for _ in $(seq 1 60); do grep -q "window from anywhere" /tmp/key-app.log && break; sleep 0.25; done
          sleep 3
          # The main window is the one titled snyvi; the tray keeps a hidden
          # helper window of the same class.
          main() { for id in $(xdotool search --classname snyvi-app); do
                     [ "$(xdotool getwindowname "$id")" = snyvi ] && echo "$id"; done; }
          state() { xwininfo -id "$(main)" | sed -n 's/.*Map State: //p'; }
          test -n "$(main)" || { echo "no main window found"; cat /tmp/key-app.log; exit 1; }
          # Focus is the manager's to give, and a probe should not hope for it:
          # a press finds the window in front and hides it, or finds it not
          # and shows it, so a press on a window the manager has not focused
          # yet shows a window that is already shown, and the map state never
          # moves. Four such presses in a row is what this step's failures on
          # the arm runner were, every time. So the window is not pressed
          # until the manager says it is the active one, checked and asked
          # again while it is not, and the active window is in the log.
          active() { xdotool getactivewindow 2>/dev/null || echo none; }
          focus() { for _ in 1 2 3 4 5 6 7 8; do
                      xdotool windowactivate --sync "$(main)" 2>/dev/null || true
                      xdotool windowfocus --sync "$(main)" 2>/dev/null || true
                      sleep 0.5; [ "$(active)" = "$(main)" ] && return 0; done; return 1; }
          focus || echo "the manager did not make the window active (active: $(active), main: $(main))"
          seen=$(state); echo "at first: $seen, active $(active)"
          for n in 1 2 3 4; do
            [ "$(state)" = IsViewable ] && focus
            xdotool key ctrl+shift+space; sleep 2
            now=$(state); seen="$seen $now"; echo "press $n: $now, active $(active)"
          done
          echo "$seen" | grep -q "IsUnMapped.*IsViewable" && exit 0
          echo "the key did not hide and then show the window"; cat /tmp/key-app.log; exit 1
          INNER
          xvfb-run -a -s "-screen 0 1280x860x24" dbus-run-session -- sh /tmp/press.sh
          pkill -x snyvi-app || true
          pkill -x openbox || true
          ./target/release/snyvi stop || true

      - name: Package both, install the way a person would
        # Same reason the static package is built here: a packaging path that
        # only runs at release time is broken exactly when it matters. This one
        # has more to get wrong, because it is the only package that declares
        # dependencies.
        run: |
          set -e
          main=$(packaging/deb.sh target/release/snyvi 0.0.0-ci ${{ matrix.deb_arch }} /tmp/deb-split)
          addon=$(packaging/deb.sh --desktop target/release/snyvi-app 0.0.0-ci ${{ matrix.deb_arch }} /tmp/deb-split)
          dpkg-deb -I "$addon"
          # The dependencies are read out of the binary, so they must name webkit
          # and the package it adds to; forgetting either installs something that
          # then cannot open a window.
          dpkg-deb -f "$addon" Depends | grep -q libwebkit2gtk-4.1-0
          dpkg-deb -f "$addon" Depends | grep -q 'snyvi (= 0.0.0-ci)'
          # The tray's, since 0.7. This one is written by hand, because the
          # library is dlopened rather than linked and shlibdeps cannot see a
          # dlopen -- so the risk is that the hand-written name goes stale.
          # Check it against the name the binary actually asks for.
          dpkg-deb -f "$addon" Depends | grep -q 'libayatana-appindicator3-1 | libappindicator3-1'
          # A substring, not a whole line: Rust packs its string literals
          # together, so this name sits inside a run of others.
          strings -a target/release/snyvi-app | grep -qF 'libayatana-appindicator3.so.1' || {
            echo "the tray no longer loads libayatana-appindicator3.so.1; the .deb dependency is stale"
            exit 1; }
          # The add-on ships the window and nothing else: it must not own a path
          # the main package owns. Listed once into a variable, because `grep -q`
          # closes the pipe and dpkg-deb's tar then dies mid-write.
          files=$(dpkg-deb -c "$addon" | awk '{print $NF}')
          echo "$files" | grep -qx './usr/bin/snyvi-app' || { echo "add-on has no window binary"; exit 1; }
          echo "$files" | grep -qx './usr/bin/snyvi' && { echo "add-on claims /usr/bin/snyvi"; exit 1; } || true

          # This is the order a person does it in: snyvi first, on its own.
          sudo dpkg -i "$main"
          test "$(command -v snyvi)" = /usr/bin/snyvi
          snyvi --version
          desktop-file-validate /usr/share/applications/snyvi.desktop
          # With no window installed it must still open something and return,
          # rather than fail. Which rung it lands on depends on what browsers the
          # machine has -- this runner has Chromium, a user may have none -- so
          # the test is that it succeeded and that no native window ran, not
          # which fallback it chose.
          export SNYVI_DATA_DIR=/tmp/s-pkg SNYVI_CONFIG_DIR=/tmp/c-pkg SNYVI_PORT=7813
          xvfb-run -a -s "-screen 0 1280x860x24" dbus-run-session -- \
            timeout 20 snyvi app > /tmp/app-nowin.log 2>&1 || code=$?
          test "${code:-0}" = "0" || { echo "snyvi app failed without the add-on (exit ${code:-0}):"; cat /tmp/app-nowin.log; exit 1; }
          pgrep -x snyvi-app >/dev/null && { echo "a native window ran with no add-on installed"; exit 1; } || true
          snyvi stop || true

          # Then adding the window, which is the whole claim: an addition, not a
          # replacement. apt resolves its dependencies; snyvi stays installed.
          sudo apt-get install -y -qq "$addon"
          dpkg -l snyvi | grep -q '^ii' || { echo "snyvi was removed by the add-on"; exit 1; }
          # 124 is the timeout firing. It is also the proof that this was the
          # native window: `snyvi app` execs it and stays in the foreground,
          # where every browser fallback spawns and returns 0 at once.
          unset code
          xvfb-run -a -s "-screen 0 1280x860x24" dbus-run-session -- \
            timeout 20 snyvi app > /tmp/app-pkg.log 2>&1 || code=$?
          test "${code:-0}" = "124" || { echo "packaged window did not hold the foreground (exit ${code:-0}):"; cat /tmp/app-pkg.log; exit 1; }
          snyvi stop

      # 0.7 shipped an icon drawn at every size and no way for the shell to
      # find it: the entry is snyvi.desktop, the window calls itself snyvi-app,
      # and a window that matches no entry gets a generic icon in the dock and
      # the switcher. Nothing reports it -- not desktop-file-validate, which
      # sees a valid file, and not the window, which opened fine.
      #
      # So the class is read off a real window rather than trusted: the two
      # ends are set in different files, and a tauri that starts setting the
      # GTK app id would move one without the other.
      - name: The window's class must match the desktop entry
        run: |
          set -e
          export SNYVI_DATA_DIR=/tmp/s-wm SNYVI_CONFIG_DIR=/tmp/c-wm SNYVI_PORT=7814
          want=$(sed -n 's/^StartupWMClass=//p' /usr/share/applications/snyvi.desktop)
          test -n "$want" || { echo "snyvi.desktop declares no StartupWMClass"; exit 1; }
          export want
          cat > /tmp/wmclass.sh <<'INNER'
          set -e
          snyvi send README.md >/dev/null 2>&1 || true
          snyvi-app "http://127.0.0.1:$SNYVI_PORT/" >/tmp/wm-app.log 2>&1 &
          # WM_CLASS is two strings, instance then class ("snyvi-app",
          # "Snyvi-app"). GNOME matches StartupWMClass against either, so print
          # both and let the caller decide.
          #
          # The tray keeps a hidden X window of its own, class "tray-icon tray
          # app snyvi", and on a slow runner it is mapped before the main
          # window is. So a window of some other class is not the answer, only
          # noted: keep looking until one carries the class the entry names,
          # and when none does in fifteen seconds print what was seen, so a
          # window of the wrong class still fails with the class it had.
          : > /tmp/wm-seen
          for _ in $(seq 1 60); do
            for id in $(xwininfo -root -children | grep -oE '^ +0x[0-9a-f]+' | tr -d ' '); do
              out=$(xprop -id "$id" WM_CLASS 2>/dev/null || true)
              case "$out" in
                *"\"$want\""*) echo "$out"; exit 0;;
                *snyvi*|*Snyvi*) echo "$out" >> /tmp/wm-seen;;
              esac
            done
            sleep 0.25
          done
          echo "no window of class $want appeared; windows seen:"; sort -u /tmp/wm-seen
          cat /tmp/wm-app.log; exit 1
          INNER
          got=$(xvfb-run -a -s "-screen 0 1280x860x24" dbus-run-session -- \
                  sh /tmp/wmclass.sh | grep WM_CLASS)
          echo "$got"
          # Quoted, so that "snyvi" can never pass for "snyvi-app".
          echo "$got" | grep -qF "\"$want\"" || {
            echo "the window's class is not $want, so the shell will find no entry for it"
            echo "snyvi.desktop says StartupWMClass=$want"
            exit 1; }
          snyvi stop || true

      - name: Remove the packages
        run: sudo dpkg -r snyvi-app snyvi

  windows:
    # One job, not two. The split on Linux exists because a static musl binary
    # cannot link WebKitGTK; Windows has no such fork -- snyvi.exe links no
    # engine and snyvi-app.exe uses WebView2, which ships with the operating
    # system rather than being a package to depend on. So both are built here
    # and both go in one zip.
    # Every step here either finishes in seconds or is a build; the default
    # is six hours, which is what a daemon holding a pipe open costs before
    # anyone notices.
    needs: gate
    if: needs.gate.outputs.full == 'true'
    timeout-minutes: 35
    runs-on: windows-latest
    # Without fat LTO, for the reason given on the desktop job.
    env:
      CARGO_PROFILE_RELEASE_LTO: "off"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows
      - name: Test
        run: cargo test --release
      - name: Build
        # Two passes, the same shape as the release: snyvi must not be built
        # with the desktop feature, so that tauri's build script cannot follow
        # it into a binary that never opens a window. It is also what gives
        # snyvi.exe its own icon resource, which build.rs only attaches when
        # the feature is off.
        shell: bash
        run: |
          set -e
          cargo build --release --bin snyvi 2>&1 | tee build.log
          cargo build --release --bin snyvi-app --features desktop
          # build.rs attaches the icon best-effort, so that a machine without
          # the SDK's resource compiler still produces a working snyvi.exe --
          # which means a silent warning is the only sign it did not. This
          # runner has the SDK, so here it is not allowed to be silent.
          grep -q "no icon resource" build.log && {
            echo "snyvi.exe was built without its icon"; exit 1; } || true
      - name: Smoke test the daemon
        shell: bash
        run: |
          set -e
          export SNYVI_DATA_DIR="$RUNNER_TEMP/s" SNYVI_CONFIG_DIR="$RUNNER_TEMP/c" SNYVI_PORT=7794
          url=$(./target/release/snyvi.exe send README.md)
          echo "$url"
          curl -sf "$url" > /dev/null
          curl -sf "http://127.0.0.1:7794/api/health"
          # The daemon was started detached by that send: if the flags were
          # wrong it would already be gone, or have taken the shell with it.
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:7794/api/docs \
            -H 'content-type: application/json' -d '{"content":"x"}')" = "401"
          # SNYVI_BENCH_SHARED for the one row that is the runner's rather than
          # snyvi's: this VM takes 405 ms to create a process where the Linux
          # runner takes 13 and a dev box 11, and the 300 ms the factor allows
          # is not enough. That row is printed; every other row is enforced,
          # and they all pass here with room, so a daemon that got slow at
          # anything but being started would still fail this step.
          SNYVI_BENCH_SHARED=1 SNYVI_BENCH_FACTOR=3 ./target/release/snyvi.exe bench --check
          ./target/release/snyvi.exe stop
      - name: Open a window
        shell: bash
        # Through `snyvi app` rather than by running the window directly,
        # because the thing worth testing is the lookup: it searches for a
        # sibling, and on Windows that name ends in .exe.
        run: |
          set -e
          export SNYVI_DATA_DIR="$RUNNER_TEMP/s2" SNYVI_CONFIG_DIR="$RUNNER_TEMP/c2" SNYVI_PORT=7795
          ./target/release/snyvi.exe app > "$RUNNER_TEMP/app.log" 2>&1 &
          launcher=$!
          sleep 20
          tasklist //FI "IMAGENAME eq snyvi-app.exe" | grep -q snyvi-app.exe || {
            echo "no native window is running:"; cat "$RUNNER_TEMP/app.log"; exit 1; }
          grep -q "no native window" "$RUNNER_TEMP/app.log" && {
            echo "fell back to a browser"; exit 1; } || true
          taskkill //F //IM snyvi-app.exe
          kill "$launcher" 2>/dev/null || true
          ./target/release/snyvi.exe stop
      - name: install-cli puts the folder on the user PATH
        # There is nothing to link on Windows; what a newcomer needs is the
        # folder they unzipped into on PATH, which is what this writes, once.
        shell: bash
        run: |
          set -e
          ./target/release/snyvi.exe install-cli | tee "$RUNNER_TEMP/cli.log"
          grep -q "Added" "$RUNNER_TEMP/cli.log"
          dir=$(cd target/release && pwd -W | sed 's|/|\\|g')
          powershell -NoProfile -Command "[Environment]::GetEnvironmentVariable('Path','User')" | tr ';' '\n' | grep -qiF "$dir" || {
            echo "the user PATH does not carry $dir:"; powershell -NoProfile -Command "[Environment]::GetEnvironmentVariable('Path','User')"; exit 1; }
          ./target/release/snyvi.exe install-cli | grep -q "already on your PATH"
      - name: Package the way the release does
        # Same reason the .deb is built here: a packaging path that only runs
        # at release time is broken exactly when it matters. These are the
        # release job's commands against a version that is obviously not one.
        shell: pwsh
        run: |
          $name = "snyvi-0.0.0-ci-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item target/release/snyvi.exe, target/release/snyvi-app.exe, README.md "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          $file = "dist/$name.zip"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText((Join-Path (Resolve-Path "dist") "$name.zip.sha256"), "$hash  $name.zip`n")
      - name: The zip carries both executables, and the checksum reads like the others
        shell: bash
        run: |
          set -e
          cd dist
          name=snyvi-0.0.0-ci-x86_64-pc-windows-msvc
          files=$(unzip -Z1 "$name.zip")
          echo "$files"
          echo "$files" | grep -qx "$name/snyvi.exe"
          echo "$files" | grep -qx "$name/snyvi-app.exe"
          # Written by PowerShell, read by the tool everyone checks the Linux
          # assets with: two spaces, a bare filename, one newline and no BOM.
          sha256sum -c "$name.zip.sha256"
      - name: The window is a window, not a console program
        # A double-click on a console program opens a terminal beside it. The
        # subsystem is one number in the PE header: 2 is a window, 3 a console.
        shell: pwsh
        run: |
          $b = [IO.File]::ReadAllBytes("target/release/snyvi-app.exe")
          $pe = [BitConverter]::ToInt32($b, 0x3C)
          $sub = [BitConverter]::ToUInt16($b, $pe + 0x5C)
          if ($sub -ne 2) { throw "snyvi-app.exe has subsystem $sub, not 2 (a window)" }
      - name: Build the installer
        shell: pwsh
        run: pwsh packaging/windows.ps1 0.0.0-ci
      - name: Install, open the way a double-click does, uninstall
        # The installer is the Windows install the README gives, so it is run
        # here the way a reader runs it, only silently: files where they
        # should be, snyvi on PATH, the Start menu entry opening a window and
        # a daemon, and an uninstall that takes all of that back out and
        # leaves the library alone.
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:SNYVI_DATA_DIR = "$env:RUNNER_TEMP\si"; $env:SNYVI_CONFIG_DIR = "$env:RUNNER_TEMP\ci"
          $env:SNYVI_PORT = "7796"
          $setup = "dist\snyvi-0.0.0-ci-x86_64-pc-windows-msvc-setup.exe"
          $app = "$env:LOCALAPPDATA\Programs\snyvi"
          $userPath = { [Environment]::GetEnvironmentVariable('Path', 'User') -split ';' }

          Start-Process -Wait -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$env:RUNNER_TEMP\setup.log"
          foreach ($f in "$app\snyvi.exe", "$app\snyvi-app.exe", "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\snyvi.lnk") {
            if (-not (Test-Path $f)) { Get-Content "$env:RUNNER_TEMP\setup.log"; throw "not installed: $f" }
          }
          if (-not ((& $userPath) -contains $app)) { throw "the user PATH does not carry $app" }

          # What the Start menu entry runs: the window with no argument.
          Start-Process -FilePath "$app\snyvi-app.exe"
          $up = $false
          foreach ($i in 1..60) {
            Start-Sleep -Milliseconds 500
            try { Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:7796/api/health" | Out-Null; $up = $true; break } catch {}
          }
          if (-not $up) { throw "no daemon answered after opening snyvi-app.exe" }
          Start-Sleep -Seconds 10
          if (-not (Get-Process snyvi-app -ErrorAction SilentlyContinue)) { throw "no window is running" }
          & "$app\snyvi.exe" send README.md
          if ($LASTEXITCODE -ne 0) { throw "the installed snyvi could not send" }

          # The uninstaller hands itself to a copy in %TEMP% and exits, so
          # its exit is not the end of it; the files going is.
          Start-Process -Wait -FilePath "$app\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          foreach ($i in 1..60) { if (-not (Test-Path "$app\snyvi.exe")) { break }; Start-Sleep -Milliseconds 500 }
          if (Test-Path "$app\snyvi.exe") { throw "the uninstall left $app\snyvi.exe" }
          if ((& $userPath) -contains $app) { throw "the uninstall left $app on PATH" }
          if (Get-Process snyvi-app -ErrorAction SilentlyContinue) { throw "the uninstall left the window running" }
          try { Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:7796/api/health" | Out-Null; throw "the uninstall left the daemon running" }
          catch { if ($_.Exception.Message -like "*left the daemon*") { throw } }
          if (-not (Test-Path "$env:SNYVI_DATA_DIR")) { throw "the uninstall took the library" }

  macos:
    # The third desktop. Both executables in one bundle, the window using the
    # WebKit that is part of the system, so there is no add-on here either.
    # The two things a Mac alone can do to the bundle -- the icon and the
    # ad-hoc signature -- are done and checked here; the layout is checked on
    # Linux above.
    needs: gate
    strategy:
      # Both legs report: one architecture's failure is not the other's.
      fail-fast: false
      matrix:
        # The Intel leg is the slowest runner here by twice, and it held
        # every pull request's check for its 17 minutes. It runs on main,
        # on workflow_dispatch, and in release.yml's dry run; a pull
        # request gets Apple silicon alone, and a merge the gate lets
        # through on its pull request's run gets Intel alone. The gate
        # writes the list, since a matrix cannot drop an include entry by
        # condition.
        include: ${{ fromJSON(needs.gate.outputs.macs) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    # Without fat LTO, for the reason given on the desktop job.
    env:
      CARGO_PROFILE_RELEASE_LTO: "off"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-${{ matrix.target }}
      - name: Test
        run: cargo test --release
      - name: Build
        # Two passes, the same shape as Windows and the release: snyvi is
        # never built with the desktop feature.
        run: |
          cargo build --release --bin snyvi
          cargo build --release --bin snyvi-app --features desktop
      - name: Smoke test the daemon
        run: |
          set -e
          file target/release/snyvi target/release/snyvi-app
          export SNYVI_DATA_DIR="$RUNNER_TEMP/s" SNYVI_CONFIG_DIR="$RUNNER_TEMP/c" SNYVI_PORT=7796
          url=$(./target/release/snyvi send README.md)
          echo "$url"
          curl -sf "$url" > /dev/null
          curl -sf http://127.0.0.1:7796/api/health
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:7796/api/docs \
            -H 'content-type: application/json' -d '{"content":"x"}')" = "401"
          # What the two ways of reading a process's memory say about this
          # daemon, side by side, because on macOS they disagree: ps counts
          # pages the allocator has given back with MADV_FREE and the kernel
          # has not yet taken, and the footprint does not. The bench reads
          # the footprint; this is the evidence for why.
          pid=$(curl -s http://127.0.0.1:7796/api/health | sed -n 's/.*"pid":\([0-9]*\).*/\1/p')
          echo "ps rss: $(ps -o rss= -p "$pid") kB"
          vmmap --summary "$pid" | grep -i footprint || echo "vmmap could not read the daemon"
          # SNYVI_BENCH_SHARED as on the Windows runner: the clocks here are
          # this VM's, and the rows that are not clocks are enforced.
          SNYVI_BENCH_SHARED=1 SNYVI_BENCH_FACTOR=3 ./target/release/snyvi bench --check
          ./target/release/snyvi stop
      - name: Package the way the release does
        run: |
          set -e
          app=$(packaging/app.sh target/release/snyvi target/release/snyvi-app 0.0.0-ci dist)
          find "$app" -type f | sort
          plutil -lint "$app/Contents/Info.plist"
          test -f "$app/Contents/Resources/snyvi.icns"
          # Ad-hoc: no identity, but the signature Apple silicon insists on.
          codesign --verify --deep --strict "$app"
          codesign -dv "$app" 2>&1 | grep -q 'Signature=adhoc'
      - name: Open a window from the bundle, with no URL
        # What a double-click does. snyvi-app with nothing on argv hands over
        # to the snyvi beside it, which starts the daemon and runs the window
        # with the URL; so the daemon must be answering and the window must be
        # up, from one command that was given neither.
        run: |
          set -e
          export SNYVI_DATA_DIR="$RUNNER_TEMP/s2" SNYVI_CONFIG_DIR="$RUNNER_TEMP/c2" SNYVI_PORT=7797
          dist/snyvi.app/Contents/MacOS/snyvi-app > "$RUNNER_TEMP/app.log" 2>&1 &
          sleep 20
          cat "$RUNNER_TEMP/app.log"
          curl -sf http://127.0.0.1:7797/api/health
          pgrep -x snyvi-app >/dev/null || { echo "no native window is running"; exit 1; }
          grep -q "no native window" "$RUNNER_TEMP/app.log" && { echo "fell back to a browser"; exit 1; } || true
          # The daemon must know it has a window: the page said so when it
          # opened its stream, which is what makes a link open there.
          curl -s http://127.0.0.1:7797/api/health | grep -q '"window":true' || {
            echo "the daemon does not see the window:"; curl -s http://127.0.0.1:7797/api/health; exit 1; }
          pkill -x snyvi-app || true
          dist/snyvi.app/Contents/MacOS/snyvi stop
      - name: install-cli links the bundle's command line
        # The README's old `ln -s` into /usr/local/bin fails on a fresh Mac,
        # where that directory is root's or absent. The command tries it and
        # falls to ~/.local/bin, and says when the one it used is not on PATH.
        run: |
          set -e
          app=$(cd dist/snyvi.app/Contents/MacOS && pwd -P)
          "$app/snyvi" install-cli "$RUNNER_TEMP/bin" | tee "$RUNNER_TEMP/cli.log"
          test "$(readlink "$RUNNER_TEMP/bin/snyvi")" = "$app/snyvi"
          "$RUNNER_TEMP/bin/snyvi" --version
          grep -q "not on PATH" "$RUNNER_TEMP/cli.log"
          # The default: /usr/local/bin when it can be written, else ~/.local/bin.
          "$app/snyvi" install-cli | tee "$RUNNER_TEMP/cli2.log"
          if [ -w /usr/local/bin ]; then want=/usr/local/bin/snyvi; else want=$HOME/.local/bin/snyvi; fi
          test "$(readlink "$want")" = "$app/snyvi"
