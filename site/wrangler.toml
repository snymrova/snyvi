# snyvi.com: static assets, built by build.mjs into out/, and one small worker.
# Deployed by .github/workflows/site.yml; by hand: node site/build.mjs && npx wrangler deploy -c site/wrangler.toml
name = "snyvi-site"
# The account is not a secret; naming it here is what lets a deploy run with
# only the API token, in CI or by hand.
account_id = "0f6e3c93463d6bce9eef05d4cf0ae0ff"
# worker.js answers byte ranges for the tour clips (/tour/*) and nothing else.
main = "worker.js"
compatibility_date = "2026-09-01"
# www.snyvi.com is site/www, a redirect to here.
routes = [{ pattern = "snyvi.com", custom_domain = true }]

[assets]
directory = "./out"
binding = "ASSETS"
run_worker_first = ["/tour/*"]
html_handling = "drop-trailing-slash"
not_found_handling = "404-page"
